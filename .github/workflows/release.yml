name: release
# Releases are driven by release-please (plans/release.md): every push to main
# updates one "release PR"; merging it tags vX.Y.Z, creates the GitHub release and
# publishes nexus-harness to PyPI. Nothing ships until that PR is merged.
# The file name is bound to the PyPI trusted publisher; do not rename it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish an existing tag (e.g. v0.2.0) whose publish failed"
        required: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A PR opened with the default GITHUB_TOKEN does not start other workflows,
      # so the release PR would never get its ci-ok check. Use the app token.
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write     # upload release assets
      id-token: write     # PyPI trusted publishing (no stored token)
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.TAG }}"}
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches pyproject version
        run: |
          v=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != pyproject $v"; exit 1; }
      - run: uv build
      - name: Wheel contains the web, TUI and agent assets
        run: uv run --with pytest --with pytest-asyncio --with setuptools pytest -q tests/test_model_data_package.py tests/test_install_script.py
      - run: uv publish --trusted-publishing always
      - name: Attach installer, checksums and dists to the release
        run: |
          sha256sum install.sh install.ps1 dist/* > SHA256SUMS
          gh release upload "$TAG" install.sh install.ps1 SHA256SUMS dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
