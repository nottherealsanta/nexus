name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write   # PyPI trusted publishing (no stored token)
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches pyproject version
        run: |
          v=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject $v"; exit 1; }
      - run: uv build
      - name: Wheel contains the web, TUI and agent assets
        run: uv run --with pytest --with setuptools pytest -q tests/test_model_data_package.py tests/test_install_script.py
      - run: uv publish
      - name: Attach installer and checksums
        run: |
          sha256sum install.sh install.ps1 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" install.sh install.ps1 SHA256SUMS dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
