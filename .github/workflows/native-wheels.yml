name: native wheels
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      runners:
        type: string
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "macos-15-intel"]'
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
      # The NSH browser client (nexus/ui/nsh/, git-ignored) must exist before the wheel is
      # built so setuptools packages it. Not verified locally; see docs/nsh-client.md.
      - name: Build the NSH web client bundle
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.2.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          rustup target add wasm32-unknown-unknown
          scripts/nsh-app.sh package web
      - name: Pin Rust 1.97 on macOS (Linux installs it inside the build container)
        if: runner.os == 'macOS'
        run: rustup toolchain install 1.97.0 --profile minimal && rustup default 1.97.0
      - name: Build and install platform wheels
        run: uvx --from cibuildwheel==3.1.4 cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: 'cp313-* cp314-*'
          CIBW_ARCHS: native
          # Do not build musllinux x86_64 wheels: torch/constriction (the default
          # dictation runtime) publish no musl wheels, so the repaired-wheel
          # install test can never resolve them there -- Python markers cannot
          # tell musl from glibc (this blocked the 0.7.x publishes). install.sh
          # rejects musl x86_64 with a diagnostic, so no supported user needs
          # this wheel. musllinux aarch64, manylinux and macOS still build.
          CIBW_SKIP: "*-musllinux_x86_64"
          # nexus-live's default `audio` feature (cpal -> alsa-sys) needs ALSA headers and
          # pkg-config on Linux: apk on musllinux, dnf/yum on manylinux. Opus is the
          # pure-Rust unsafe-libopus crate, so no libopus/CMake is installed.
          CIBW_BEFORE_ALL_LINUX: >-
            (if command -v apk >/dev/null; then apk add --no-cache alsa-lib-dev pkgconf;
            elif command -v dnf >/dev/null; then dnf install -y alsa-lib-devel pkgconf-pkg-config;
            else yum install -y alsa-lib-devel pkgconfig; fi) &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.97.0
          # Rust's musl targets default to `crt-static`, which makes rustc ask ld for a static
          # libasound. Alpine ships no static alsa-lib (`alsa-lib-dev` has only libasound.so,
          # and there is no `alsa-lib-static` package), so link the musl CRT dynamically.
          # This is already the default on glibc, so it is a no-op on manylinux.
          CIBW_ENVIRONMENT_LINUX: 'PATH=$HOME/.cargo/bin:$PATH RUSTFLAGS="-C target-feature=-crt-static"'
          # The installed wheel must launch both native binaries (nexus-live is an
          # `optional` setuptools-rust bin, so only this step notices a skipped build) and
          # import the native surface without loading an obsolete terminal toolkit.
          CIBW_TEST_COMMAND: >-
            nexus-ratatui --version &&
            nexus-live --version &&
            python -c "from nexus.host.web import NSH_ROOT; assert (NSH_ROOT / 'index.html').is_file(), 'wheel lacks the NSH client'" &&
            python -c "import sys; import nexus.ui.ratatui.prototype as p, nexus.ui.ratatui.run as r; assert 'textual' not in sys.modules, 'native import pulled in textual'; print(r.binary_path())" &&
            python -c "from nexus.ui_support import live_helper; import websockets; print(live_helper.binary_path())"
      - uses: actions/upload-artifact@v4
        with:
          name: native-wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
