name: native wheels
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
      - name: Pin Rust 1.88 on macOS (Linux installs it inside the build container)
        if: runner.os == 'macOS'
        run: rustup toolchain install 1.88.0 --profile minimal && rustup default 1.88.0
      - name: Build and install platform wheels
        run: uvx --from cibuildwheel==3.1.4 cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: 'cp313-* cp314-*'
          CIBW_ARCHS: native
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.88.0
          CIBW_ENVIRONMENT_LINUX: 'PATH=$HOME/.cargo/bin:$PATH'
          # The installed wheel must launch the native binary and import the native
          # surface without pulling in Textual (the replacement's dependency goal).
          CIBW_TEST_COMMAND: >-
            nexus-ratatui --version &&
            python -c "import sys; import nexus.ui.ratatui.prototype as p, nexus.ui.ratatui.run as r; assert 'textual' not in sys.modules, 'native import pulled in textual'; print(r.binary_path())"
      - uses: actions/upload-artifact@v4
        with:
          name: native-wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
