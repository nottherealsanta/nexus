name: build artifacts
# Reusable: builds the release artifacts for one ref. Called by release.yml.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      runners:
        type: string
        default: '["ubuntu-22.04", "ubuntu-22.04-arm", "macos-15", "macos-15-intel"]'
  # A dry run: build everything for a ref without tagging or releasing, then download the workflow artifacts.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (default: the ref the run is started on)"
        type: string
        default: ''
      runners:
        description: "JSON list of runners"
        type: string
        default: '["ubuntu-22.04", "ubuntu-22.04-arm", "macos-15", "macos-15-intel"]'
permissions:
  contents: read
jobs:
  nsh-web:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.ref }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: nexus-nsh/package-lock.json}
      - uses: ./.github/actions/setup-nsh
      - run: npm ci && npm run check && npm run test:host && npm run build
        working-directory: nexus-nsh
      - name: Package the built web client and its same-origin host
        run: |
          test -s nexus-nsh/dist/Nexus/index.html
          cp nexus-nsh/scripts/serve.mjs nexus-nsh/dist/
          tar -C nexus-nsh/dist -czf nexus-web.tar.gz Nexus serve.mjs
      - uses: actions/upload-artifact@v4
        with: {name: nexus-web, path: nexus-web.tar.gz, if-no-files-found: error}
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.ref }}"}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
        working-directory: nexus-core
      - uses: actions/upload-artifact@v4
        with: {name: nexus-core, path: "nexus-core/dist/*", if-no-files-found: error}
  firecrawl:
    # The version is pinned in one place, nexus-core/nexus/firecrawl.py, which Core also checks at run time.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.ref }}"}
      - name: Build the pinned firecrawl-local from crates.io
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' nexus-core/nexus/firecrawl.py)
          [ -n "$version" ] || { echo "no VERSION in nexus-core/nexus/firecrawl.py"; exit 1; }
          cargo install firecrawl-local --version "$version" --locked --root "$RUNNER_TEMP/fc"
          echo "FC_VERSION=$version" >> "$GITHUB_ENV"
      - name: Smoke test, the binary starts and is the pinned version
        run: |
          "$RUNNER_TEMP/fc/bin/firecrawl-local" --version | grep -F "$FC_VERSION"
      - name: Name the binary for its platform
        run: |
          os=$(uname -s | tr A-Z a-z); arch=$(uname -m)
          cp "$RUNNER_TEMP/fc/bin/firecrawl-local" "firecrawl-local-$os-$arch"
          echo "ASSET=firecrawl-local-$os-$arch" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: {name: "firecrawl-${{ matrix.runner }}", path: "${{ env.ASSET }}", if-no-files-found: error}
  tui:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.ref }}"}
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libasound2-dev
      - run: cargo build --release --locked --manifest-path nexus-tui/Cargo.toml
      - name: Smoke test, the binary starts
        run: nexus-tui/target/release/nexus-tui --help
      - name: Name the binary for its platform
        run: |
          os=$(uname -s | tr A-Z a-z); arch=$(uname -m)
          cp nexus-tui/target/release/nexus-tui "nexus-tui-$os-$arch"
          echo "ASSET=nexus-tui-$os-$arch" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: {name: "tui-${{ matrix.runner }}", path: "${{ env.ASSET }}", if-no-files-found: error}
