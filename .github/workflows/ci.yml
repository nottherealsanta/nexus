name: ci
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "plans/**", "artifacts/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "plans/**", "artifacts/**"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:             # Linux on the minimum supported Python; dev machines cover macOS and 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: {enable-cache: true, python-version: "3.13"}
      - run: uv sync --locked --extra dev
      - run: uvx ruff check nexus tests
      # Textual pilot tests are timing/terminal sensitive and fail on the shared
      # runners; they run on the developer's machine before each commit.
      - run: >-
          uv run pytest -q
          --ignore=tests/test_ui_tui.py
          --ignore=tests/test_mock_tui.py
          --ignore=tests/test_tui_integration_render.py
          --ignore=tests/test_tui_model_selection_integration.py
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: uv run --with pytest --with pytest-asyncio --with setuptools pytest -q tests/test_model_data_package.py tests/test_install_script.py
  ci-ok:            # the one required status check; its name never changes with the matrix
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}" = false ]'
