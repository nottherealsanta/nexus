[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.11,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-harness"
version = "0.8.0"
description = "A small, provider-agnostic Python agent harness"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "rich>=14,<16",
    "httpcore==1.0.9",
    "msgspec>=0.18",
    "mcp>=1.2,<2",
    "firecrawl-anydoc==0.2.4",
    "claude-agent-sdk==0.2.162",
    "sounddevice>=0.5,<1",
    # GPT Live sideband WebSocket client (docs/live.md), imported lazily by
    # nexus/live/transport.py. Default so `uv tool install nexus-harness` can start a call.
    "websockets>=14,<16",
    # Code mode (docs/tools.md) is on by default, so its sandbox ships with the base install.
    "pydantic-monty==1.1.0",
    # Local speech (/speak, docs/voice.md). ptts is the official Rust runtime for gradium's
    # phonon TTS models and ships wheels for every supported platform, musl included.
    "ptts>=0.4.1,<1",
    "numpy>=1.26",
    # Local dictation (docs/voice.md) is on by default too, so a plain `uv sync` and
    # `uv tool install` keep it. Torch has no musl or Intel macOS wheels and
    # `constriction` only macOS and Linux x86_64 wheels (see uv.lock), so the dictation runtime is
    # limited to macOS arm64 and glibc Linux x86_64. Python markers cannot
    # distinguish musl; install.sh rejects musl x86_64 with a clear diagnostic.
    "transformers>=5.19,<6; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "torch>=2.6,<3; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "constriction>=0.5,<0.6; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "librosa>=0.11,<1; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[project.optional-dependencies]
# Compatibility alias, included by default.
codemode = ["pydantic-monty==1.1.0"]
# Compatibility alias: speech is a base dependency now, so `nexus-harness[speak]` (still
# named by older hints and receipts) installs nothing extra. Keep the pins equal.
speak = ["ptts>=0.4.1,<1", "sounddevice>=0.5,<1", "numpy>=1.26"]
# claude-agent and documents are compatibility aliases, included by default.
claude-agent = [
    "claude-agent-sdk==0.2.162",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",  # CI runs `pytest -n auto`
    "pytest-split>=0.10",  # CI shards: pytest --splits N --group K
    "playwright==1.57.0",
    "wsproto>=1.2,<2",  # Native PTY browser checks use Uvicorn WebSockets.
    # Builds the wheel in tests/test_model_data_package.py to prove the vendored
    # models.dev catalogue and its attribution ship in the distribution.
    "setuptools>=68",
    "setuptools-rust>=1.11,<2",
]
documents = [
    "firecrawl-anydoc==0.2.4",
]
# Compatibility alias for the base dictation runtime, deliberately without the platform
# markers: `nexus voice init` uses it to attempt an install on platforms outside the default set.
voice = [
    # Bark (a Parakeet TDT checkpoint) runs on stock Transformers; constriction
    # decodes the .bark container (nexus/voice/bark.py).
    "transformers>=5.19,<6",
    "torch>=2.6,<3",
    "constriction>=0.5,<0.6",
    # Required by Transformers' ParakeetFeatureExtractor.
    "librosa>=0.11,<1",
    "numpy>=1.26",
    "sounddevice>=0.5,<1",
]
# Compatibility alias: websockets is a base dependency now, so `nexus-harness[live]`
# (still named by older hints and receipts) installs nothing extra. Keep the pins equal.
live = [
    "websockets>=14,<16",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

# The offline model catalogue and its models.dev attribution (MIT) are data
# files inside the ``nexus.model`` package, so they must be declared here or a
# built wheel silently drops them and ``ModelRegistry`` loses its offline
# fallback. ``tests/test_model_data_package.py`` builds a wheel and asserts both
# entries are present.
[tool.setuptools.package-data]
"nexus.host_support" = ["searchserver/compose.yaml", "searchserver/searxng/settings.yml"]
"nexus.model" = ["data/models.min.json", "data/NOTICE"]
"nexus.auth" = ["NOTICE"]
"nexus.voice" = ["NOTICE"]
"nexus.live" = ["NOTICE", "prompts/*.md"]
"nexus.agents" = ["data/*.md"]
"nexus.ui.web" = ["index.html", "styles/*.css", "js/*.js", "assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Offline by default: plain ``pytest`` deselects credential-gated ``live`` tests.
# An explicit command-line ``-m live`` overrides this (last ``-m`` wins), e.g.
# ``ANTHROPIC_API_KEY=... pytest -m live tests/test_anthropic_live.py``.
addopts = "-m 'not live'"
markers = [
    "live: tests that hit real providers and require credentials; excluded from the offline suite",
]

[tool.ruff]
# CI runs `ruff check`; keep the rule set explicit so a ruff upgrade cannot redden it.
extend-exclude = ["tests/fixtures", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "E713"]

# The presentation-only Rust subprocess ships beside the Python console script.
[[tool.setuptools-rust.bins]]
target = "nexus-ratatui"
path = "rust/tui/Cargo.toml"
cargo-manifest-args = ["--locked"]
# CLI/browser installs remain available without Rust; chat requires the executable.
# The wheel CI test (`nexus-ratatui --version`) fails if a supported platform loses the binary.
optional = true

# The audio/WebRTC helper for `/live` ships the same way (rust/live/README.md).
[[tool.setuptools-rust.bins]]
target = "nexus-live"
path = "rust/live/Cargo.toml"
cargo-manifest-args = ["--locked"]
# Kept optional so a source install without Rust/ALSA still gives a working CLI; Voice
# calls then report `unsupported`. Published wheels must never lose it silently: the
# wheel CI test (`nexus-live --version`, native-wheels.yml) fails if the build skipped it.
optional = true
