[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-harness"
version = "0.1.0"
description = "A small, UI-independent Python agent harness powered by Codex"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]
