[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-harness"
version = "0.1.0"
description = "A small, provider-agnostic Python agent harness"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "msgspec>=0.18",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
# The interactive line editor for `nexus ui`/`nexus chat` (PLAN §14.11). It is
# optional and imported lazily: the CLI degrades to a plain stdin reader when
# this extra is absent, and one-shot/JSONL runs never import it.
cli = ["prompt_toolkit>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Builds the wheel in tests/test_model_data_package.py to prove the vendored
    # models.dev catalogue and its attribution ship in the distribution.
    "setuptools>=68",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

# The offline model catalogue and its models.dev attribution (MIT) are data
# files inside the ``nexus.model`` package, so they must be declared here or a
# built wheel silently drops them and ``ModelRegistry`` loses its offline
# fallback. ``tests/test_model_data_package.py`` builds a wheel and asserts both
# entries are present.
[tool.setuptools.package-data]
"nexus.model" = ["data/models.min.json", "data/NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Offline by default: plain ``pytest`` deselects credential-gated ``live`` tests.
# An explicit command-line ``-m live`` overrides this (last ``-m`` wins), e.g.
# ``ANTHROPIC_API_KEY=... pytest -m live tests/test_anthropic_live.py``.
addopts = "-m 'not live'"
markers = [
    "live: tests that hit real providers and require credentials; excluded from the offline suite",
]
