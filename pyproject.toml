[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-harness"
version = "0.1.0"
description = "A small, provider-agnostic Python agent harness"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "msgspec>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Offline by default: plain ``pytest`` deselects credential-gated ``live`` tests.
# An explicit command-line ``-m live`` overrides this (last ``-m`` wins), e.g.
# ``ANTHROPIC_API_KEY=... pytest -m live tests/test_anthropic_live.py``.
addopts = "-m 'not live'"
markers = [
    "live: tests that hit real providers and require credentials; excluded from the offline suite",
]
