[package]
name = "nexus-tui"
version = "0.10.0-dev.0"
edition = "2021"
rust-version = "1.85"
description = "Nexus 0.10 terminal client (Ratatui). Speaks only the Core HTTP API."
license = "UNLICENSED"
publish = false

[[bin]]
name = "nexus-tui"
path = "src/main.rs"

[dependencies]
ratatui = "=0.29.0"
crossterm = "=0.28.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process", "signal"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["v4"] }
bytes = "=1.12.1"
toml = "=0.8.23"
unicode-width = "=0.2.0"
unicode-segmentation = "=1.13.3"
pulldown-cmark = { version = "=0.13.4", default-features = false }
libc = "=0.2.191"
