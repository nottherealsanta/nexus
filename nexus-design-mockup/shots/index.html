<!doctype html>
<meta charset="utf-8">
<title>Nexus design chooser</title>
<style>
:root { --bg:#0e0e0f; --card:#17171a; --line:#2a2a2e; --fg:#e6e7e8; --sec:#a4a9ae; --mut:#7d838a; --acc:#e8a46e; --ok:#8fc46a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, -apple-system, sans-serif; }
header { position:sticky; top:0; z-index:5; display:flex; gap:18px; align-items:center; padding:10px 24px; background:#141416ee; backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
header h1 { font-size:15px; margin:0; font-weight:600; }
header .grow { flex:1; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg button { background:none; border:0; color:var(--sec); padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; }
.seg button.on { background:#2a2622; color:var(--fg); }
.btn { background:var(--acc); color:#151515; border:0; border-radius:7px; padding:6px 14px; font:inherit; font-weight:600; cursor:pointer; }
.btn.ghost { background:none; color:var(--sec); border:1px solid var(--line); font-weight:500; }
.progress { color:var(--mut); font-size:13px; }
nav { position:fixed; top:58px; left:0; width:230px; bottom:0; overflow:auto; padding:14px 10px; border-right:1px solid var(--line); }
nav a { display:flex; gap:8px; align-items:baseline; padding:4px 10px; border-radius:6px; color:var(--sec); text-decoration:none; font-size:13px; }
nav a:hover { background:#1c1c20; }
nav a .k { color:var(--mut); width:30px; flex:none; }
nav a .pick { margin-left:auto; color:var(--ok); font-weight:600; }
main { margin-left:230px; padding:8px 32px 120px; }
section { padding:28px 0 20px; border-bottom:1px solid var(--line); }
section h2 { margin:0 0 4px; font-size:19px; font-weight:600; }
section h2 .k { color:var(--mut); font-weight:500; margin-right:8px; }
.q { color:var(--sec); margin:0 0 16px; max-width:900px; }
.opts { display:grid; grid-template-columns:repeat(auto-fill, minmax(520px, 1fr)); gap:18px; }
.opt { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
.opt.chosen { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
.opt .imgs { display:flex; flex-direction:column; gap:1px; background:var(--line); }
.opt figure { margin:0; background:#0b0b0b; position:relative; }
.opt figure img { width:100%; display:block; cursor:zoom-in; }
.opt figure figcaption { position:absolute; left:8px; top:6px; font-size:11px; color:#ddd; background:#000a; padding:1px 7px; border-radius:5px; }
.opt .pending { padding:40px; text-align:center; color:var(--mut); font-size:13px; }
.opt .body { padding:12px 16px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
.opt .title { display:flex; align-items:center; gap:8px; font-weight:600; }
.badge { font-size:11px; font-weight:600; padding:1px 7px; border-radius:5px; background:#2a2622; color:var(--acc); }
.badge.cur { background:#222; color:var(--mut); }
.badge.old { background:#1d2433; color:#7aa7f0; }
.opt .desc { color:var(--sec); font-size:13px; }
.opt .choose { margin-top:auto; align-self:flex-start; }
.opt.chosen .choose { background:var(--ok); }
textarea { width:100%; max-width:900px; margin-top:14px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:13px; min-height:38px; }
#lb { position:fixed; inset:0; background:#000e; z-index:20; display:none; overflow:auto; cursor:zoom-out; }
#lb.on { display:block; }
#lb img { display:block; margin:24px auto; max-width:calc(100vw - 48px); }
#lb img.full { max-width:none; cursor:zoom-out; }
#lb .hint { position:fixed; top:10px; right:18px; color:#aaa; font-size:12px; }
#export { position:fixed; inset:0; background:#000c; z-index:30; display:none; align-items:center; justify-content:center; }
#export.on { display:flex; }
#export .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; width:min(900px, 92vw); }
#export textarea { max-width:none; height:55vh; font-family:ui-monospace, monospace; font-size:12px; }
</style>
<header>
  <h1>Nexus design chooser</h1>
  <span class="seg" id="client"><button data-v="both" class="on">TUI + NSH</button><button data-v="TUI">TUI</button><button data-v="NSH">NSH</button></span>
  <span class="seg" id="theme"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button><button data-v="all">All variants</button></span>
  <span class="grow"></span>
  <span class="progress" id="progress"></span>
  <button class="btn ghost" id="recommend">Pick all recommended</button>
  <button class="btn" id="exportBtn">Export choices</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="lb"><span class="hint">click: actual size · Esc: close</span><img></div>
<div id="export"><div class="panel">
  <p style="margin:0 0 8px;color:var(--sec)">Paste this back into Claude Code, or save it as <code>nexus-design-mockup/choices.json</code> (the Download button does that).</p>
  <textarea id="exportText" readonly></textarea>
  <p style="margin:10px 0 0;display:flex;gap:10px"><button class="btn" id="copy">Copy</button><button class="btn ghost" id="download">Download choices.json</button><button class="btn ghost" id="closeExport">Close</button></p>
</div></div>
<script>
const DATA = {"decisions": [{"id": "D01", "title": "Palette and surfaces", "question": "Which colour base? The chrome (header band and sidebars) is a step away from the page in every option.", "options": [{"key": "A", "label": "nexus10 tokens + border.strong", "recommended": true, "desc": "Today's theme.toml values (neutral #0B0B0B page, warm amber accent), plus a decorative border.strong for modal frames. Contrast-checked.", "tui": ["d02-shell-200x50", "d01-tokens"], "nsh": ["d01-tokens"], "images": [{"src": "tui/d02-shell-200x50-dark.png", "theme": "dark", "client": "TUI", "label": "d02-shell-200x50"}, {"src": "tui/d02-shell-200x50-light.png", "theme": "light", "client": "TUI", "label": "d02-shell-200x50"}, {"src": "tui/d02-shell-200x50-mono.png", "theme": "mono", "client": "TUI", "label": "d02-shell-200x50"}, {"src": "tui/d02-shell-200x50-ascii.png", "theme": "ascii", "client": "TUI", "label": "d02-shell-200x50"}, {"src": "tui/d01-tokens-dark.png", "theme": "dark", "client": "TUI", "label": "d01-tokens"}, {"src": "tui/d01-tokens-light.png", "theme": "light", "client": "TUI", "label": "d01-tokens"}, {"src": "nsh/d01-tokens-dark.png", "theme": "dark", "client": "NSH", "label": "d01-tokens"}, {"src": "nsh/d01-tokens-light.png", "theme": "light", "client": "NSH", "label": "d01-tokens"}]}, {"key": "B", "label": "Old Nexus 'Grok Night'", "kind": "old", "desc": "Old Nexus palette: flatter #141414 surfaces, peach accent #fab283, lighter muted text. Softer, lower contrast.", "tui": ["alt-d01-oldpalette"], "images": [{"src": "tui/alt-d01-oldpalette-dark.png", "theme": "dark", "client": "TUI", "label": "alt-d01-oldpalette"}, {"src": "tui/alt-d01-oldpalette-light.png", "theme": "light", "client": "TUI", "label": "alt-d01-oldpalette"}]}, {"key": "C", "label": "A, with a cool focus colour", "desc": "As A, but focus bars and rings use a cool blue so focus is never confused with the accent (answers the PLAN.md open question).", "tui": ["alt-d01-coolfocus"], "images": [{"src": "tui/alt-d01-coolfocus-dark.png", "theme": "dark", "client": "TUI", "label": "alt-d01-coolfocus"}, {"src": "tui/alt-d01-coolfocus-light.png", "theme": "light", "client": "TUI", "label": "alt-d01-coolfocus"}]}]}, {"id": "D02", "title": "Shell frame and header", "question": "How is the window framed, and where do the tabs and title go?", "options": [{"key": "A", "label": "Chrome band", "recommended": true, "desc": "The header band and both sidebars share one chrome surface around the page. The tab icons sit in the band over the sidebar. The breadcrumb is aligned with the page, and the run status is on the right.", "tui": ["d02-shell-200x50", "d02-shell-120x36", "d02-child-tab"], "nsh": ["d02-shell"], "images": [{"src": "tui/d02-shell-200x50-dark.png", "theme": "dark", "client": "TUI", "label": "d02-shell-200x50"}, {"src": "tui/d02-shell-200x50-light.png", "theme": "light", "client": "TUI", "label": "d02-shell-200x50"}, {"src": "tui/d02-shell-200x50-mono.png", "theme": "mono", "client": "TUI", "label": "d02-shell-200x50"}, {"src": "tui/d02-shell-200x50-ascii.png", "theme": "ascii", "client": "TUI", "label": "d02-shell-200x50"}, {"src": "tui/d02-shell-120x36-dark.png", "theme": "dark", "client": "TUI", "label": "d02-shell-120x36"}, {"src": "tui/d02-shell-120x36-light.png", "theme": "light", "client": "TUI", "label": "d02-shell-120x36"}, {"src": "tui/d02-child-tab-dark.png", "theme": "dark", "client": "TUI", "label": "d02-child-tab"}, {"src": "tui/d02-child-tab-light.png", "theme": "light", "client": "TUI", "label": "d02-child-tab"}, {"src": "nsh/d02-shell-dark.png", "theme": "dark", "client": "NSH", "label": "d02-shell"}, {"src": "nsh/d02-shell-light.png", "theme": "light", "client": "NSH", "label": "d02-shell"}]}, {"key": "B", "label": "Old tab strip", "kind": "old", "desc": "Old Nexus: open sessions as tabs across the top, with a location row under them (~/repos/nexus \u00b7 main) and Idle on the right.", "tui": ["alt-d02-tabs"], "reference": ["tui-session.png"], "images": [{"src": "tui/alt-d02-tabs-dark.png", "theme": "dark", "client": "TUI", "label": "alt-d02-tabs"}, {"src": "tui/alt-d02-tabs-light.png", "theme": "light", "client": "TUI", "label": "alt-d02-tabs"}, {"src": "../reference/tui-session.png", "theme": "dark", "client": "TUI", "label": "old Nexus: tui-session.png"}]}, {"key": "C", "label": "Today", "kind": "current", "desc": "A header row floating on the canvas, with the tabs in the sidebar's first row.", "before": ["22-session-160x48-dark-160x48.png", "02-session-light-120x36.png"], "images": [{"src": "../before/22-session-160x48-dark-160x48.png", "theme": "dark", "client": "TUI", "label": "today: 22-session-160x48-dark-160x48.png"}, {"src": "../before/02-session-light-120x36.png", "theme": "light", "client": "TUI", "label": "today: 02-session-light-120x36.png"}]}]}, {"id": "D03", "title": "Sessions sidebar", "question": "How should session rows look?", "options": [{"key": "A", "label": "Two-line rows by project", "recommended": true, "desc": "A mark slot (\u25c6 waiting, \u25d0 running, \u2715 error, \u25cf unread), the title and time, then agent (in its colour) \u00b7 \u2325 branch and the child count. Grouped by project and worktree. The open session has a selection band; focus is a bar.", "tui": ["d03-sessions", "d03-sessions-worktrees-menu", "d03-rail"], "nsh": ["d03-sessions"], "images": [{"src": "tui/d03-sessions-dark.png", "theme": "dark", "client": "TUI", "label": "d03-sessions"}, {"src": "tui/d03-sessions-light.png", "theme": "light", "client": "TUI", "label": "d03-sessions"}, {"src": "tui/d03-sessions-worktrees-menu-dark.png", "theme": "dark", "client": "TUI", "label": "d03-sessions-worktrees-menu"}, {"src": "tui/d03-sessions-worktrees-menu-light.png", "theme": "light", "client": "TUI", "label": "d03-sessions-worktrees-menu"}, {"src": "tui/d03-rail-dark.png", "theme": "dark", "client": "TUI", "label": "d03-rail"}, {"src": "tui/d03-rail-light.png", "theme": "light", "client": "TUI", "label": "d03-rail"}, {"src": "nsh/d03-sessions-dark.png", "theme": "dark", "client": "NSH", "label": "d03-sessions"}, {"src": "nsh/d03-sessions-light.png", "theme": "light", "client": "NSH", "label": "d03-sessions"}]}, {"key": "B", "label": "Status groups (old sessions page)", "kind": "old", "desc": "One line per session, grouped under Needs you / Working / Idle headings, with the age on the right.", "tui": ["alt-d03-status-groups"], "reference": ["main-mockup-sessions.png"], "images": [{"src": "tui/alt-d03-status-groups-dark.png", "theme": "dark", "client": "TUI", "label": "alt-d03-status-groups"}, {"src": "tui/alt-d03-status-groups-light.png", "theme": "light", "client": "TUI", "label": "alt-d03-status-groups"}, {"src": "../reference/main-mockup-sessions.png", "theme": "dark", "client": "TUI", "label": "old Nexus: main-mockup-sessions.png"}]}, {"key": "C", "label": "Today", "kind": "current", "desc": "Two-line rows with no status marks and no grouping.", "before": ["01-session-dark-120x36.png"], "images": [{"src": "../before/01-session-dark-120x36.png", "theme": "dark", "client": "TUI", "label": "today: 01-session-dark-120x36.png"}]}]}, {"id": "D04", "title": "User message", "question": "How does a user message (the turn header) look?", "options": [{"key": "A", "label": "Full-bleed band", "recommended": true, "desc": "A raised band across the whole page with a muted rail (accent when focused), the fold marker inside, #2 \u00b7 time on the right and a padding row above and below. Includes a sticky copy when scrolled.", "tui": ["d04-user-band", "d04-sticky"], "nsh": ["d04-turn"], "images": [{"src": "tui/d04-user-band-dark.png", "theme": "dark", "client": "TUI", "label": "d04-user-band"}, {"src": "tui/d04-user-band-light.png", "theme": "light", "client": "TUI", "label": "d04-user-band"}, {"src": "tui/d04-sticky-dark.png", "theme": "dark", "client": "TUI", "label": "d04-sticky"}, {"src": "tui/d04-sticky-light.png", "theme": "light", "client": "TUI", "label": "d04-sticky"}, {"src": "nsh/d04-turn-dark.png", "theme": "dark", "client": "NSH", "label": "d04-turn"}, {"src": "nsh/d04-turn-light.png", "theme": "light", "client": "NSH", "label": "d04-turn"}]}, {"key": "B", "label": "Inset card (old Nexus)", "kind": "old", "desc": "A card inset by 2 cells with no rail, and the tag on the right. Closest to the old screenshots.", "tui": ["alt-d04-inset"], "reference": ["tui-diff.png"], "images": [{"src": "tui/alt-d04-inset-dark.png", "theme": "dark", "client": "TUI", "label": "alt-d04-inset"}, {"src": "tui/alt-d04-inset-light.png", "theme": "light", "client": "TUI", "label": "alt-d04-inset"}, {"src": "../reference/tui-diff.png", "theme": "dark", "client": "TUI", "label": "old Nexus: tui-diff.png"}]}, {"key": "C", "label": "Today", "kind": "current", "desc": "An inset block with the fold marker hanging outside it in the gutter.", "before": ["01-session-dark-120x36.png"], "images": [{"src": "../before/01-session-dark-120x36.png", "theme": "dark", "client": "TUI", "label": "today: 01-session-dark-120x36.png"}]}]}, {"id": "D05", "title": "Turn footer", "question": "Where do a turn's model, duration, tokens and status go?", "options": [{"key": "A", "label": "Right-aligned, end of turn", "recommended": true, "desc": "\u25aa Build \u00b7 model \u00b7 effort \u00b7 tools \u00b7 4.2s \u00b7 tokens \u00b7 cost \u00b7 right-aligned (no end-status word) with no rule (old Nexus).", "tui": ["d05-footer"], "nsh": ["d04-turn"], "images": [{"src": "tui/d05-footer-dark.png", "theme": "dark", "client": "TUI", "label": "d05-footer"}, {"src": "tui/d05-footer-light.png", "theme": "light", "client": "TUI", "label": "d05-footer"}, {"src": "nsh/d04-turn-dark.png", "theme": "dark", "client": "NSH", "label": "d04-turn"}, {"src": "nsh/d04-turn-light.png", "theme": "light", "client": "NSH", "label": "d04-turn"}]}, {"key": "B", "label": "Left, under a hairline", "desc": "The current INTERFACE_PLAN spec: one muted row below a full-width hairline, left-aligned.", "tui": ["alt-d05-left"], "images": [{"src": "tui/alt-d05-left-dark.png", "theme": "dark", "client": "TUI", "label": "alt-d05-left"}, {"src": "tui/alt-d05-left-light.png", "theme": "light", "client": "TUI", "label": "alt-d05-left"}]}, {"key": "C", "label": "Today", "kind": "current", "desc": "'<1 s \u00b7 3 tools   \u2713 done' above a rule. It reads as the next turn's header.", "before": ["21-tools-expanded-dark-120x36.png"], "images": [{"src": "../before/21-tools-expanded-dark-120x36.png", "theme": "dark", "client": "TUI", "label": "today: 21-tools-expanded-dark-120x36.png"}]}]}, {"id": "D06", "title": "Tool activity", "question": "How should tool calls and activity groups look?", "options": [{"key": "A", "label": "Verb glyph tree", "recommended": true, "desc": "Folded summaries with failures visible. A live 'Working' header with a shimmer and the newest 5 members as a tree. Members have verb glyphs (\u2192 Read, \u2190 Edit, $ Shell, * Search). The old Nexus detail box opens with \u250c \u2502 \u2570.", "tui": ["d06-groups"], "nsh": ["d06-tools"], "images": [{"src": "tui/d06-groups-dark.png", "theme": "dark", "client": "TUI", "label": "d06-groups"}, {"src": "tui/d06-groups-light.png", "theme": "light", "client": "TUI", "label": "d06-groups"}, {"src": "tui/d06-groups-mono.png", "theme": "mono", "client": "TUI", "label": "d06-groups"}, {"src": "nsh/d06-tools-dark.png", "theme": "dark", "client": "NSH", "label": "d06-tools"}, {"src": "nsh/d06-tools-light.png", "theme": "light", "client": "NSH", "label": "d06-tools"}]}, {"key": "B", "label": "Status glyphs only", "desc": "The same structure, but each member shows only its status glyph (\u2713 \u25d0 \u2715) instead of a verb glyph. Quieter, but you lose the at-a-glance verb.", "tui": ["alt-d06-status"], "images": [{"src": "tui/alt-d06-status-dark.png", "theme": "dark", "client": "TUI", "label": "alt-d06-status"}, {"src": "tui/alt-d06-status-light.png", "theme": "light", "client": "TUI", "label": "alt-d06-status"}]}, {"key": "C", "label": "Today", "k const KEY = "nexus-design-choices-v1";
const state = JSON.parse(localStorage.getItem(KEY) || "{}"); // {D02: {pick:"A", note:""}}
let client = "both", theme = "dark";
const save = () => { localStorage.setItem(KEY, JSON.stringify(state)); progress(); };
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k.startsWith("on") ? e[k] = v : e.setAttribute(k, v); for (const c of kids) e.append(c); return e; };

function progress() {
  const n = DATA.decisions.filter(d => state[d.id]?.pick).length;
  $("#progress").textContent = `${n} of ${DATA.decisions.length} chosen`;
  for (const d of DATA.decisions) { const p = $(`#nav a[href="#${d.id}"] .pick`); if (p) p.textContent = state[d.id]?.pick || ""; }
}

function render() {
  const nav = $("#nav"), main = $("#main");
  nav.innerHTML = ""; main.innerHTML = "";
  for (const d of DATA.decisions) {
    nav.append(el("a", { href: "#" + d.id }, el("span", { class: "k" }, d.id), d.title, el("span", { class: "pick" })));
    const sec = el("section", { id: d.id }, el("h2", {}, el("span", { class: "k" }, d.id), d.title), el("p", { class: "q" }, d.question));
    const grid = el("div", { class: "opts" });
    for (const o of d.options) {
      const card = el("div", { class: "opt" + (state[d.id]?.pick === o.key ? " chosen" : "") });
      const imgs = el("div", { class: "imgs" });
      // One image per shot in the chosen theme (falling back to dark); "All variants" shows every one.
      const mine = o.images.filter(i => client === "both" || i.client === client);
      const pick = theme === "all" ? mine : [...new Set(mine.map(i => i.label))].map(l => mine.find(i => i.label === l && i.theme === theme) || mine.find(i => i.label === l && i.theme === "dark") || mine.find(i => i.label === l));
      if (!pick.length) imgs.append(el("div", { class: "pending" }, client === "both" ? "No images yet" : `No ${client} mock-up for this option`));
      for (const i of pick) {
        const f = el("figure");
        if (i.src) { const im = el("img", { src: i.src, loading: "lazy" }); im.onclick = () => openLb(i.src); f.append(im); }
        else f.append(el("div", { class: "pending" }, "rendering… (" + i.label + ")"));
        f.append(el("figcaption", {}, `${i.client} · ${i.label} · ${i.theme}`));
        imgs.append(f);
      }
      const title = el("div", { class: "title" }, `${o.key}. ${o.label}`);
      if (o.recommended) title.append(el("span", { class: "badge" }, "recommended"));
      if (o.kind === "current") title.append(el("span", { class: "badge cur" }, "today"));
      if (o.kind === "old") title.append(el("span", { class: "badge old" }, "old Nexus"));
      const btn = el("button", { class: "btn choose" }, state[d.id]?.pick === o.key ? "✓ Chosen" : "Choose " + o.key);
      btn.onclick = () => { state[d.id] = { ...(state[d.id] || {}), pick: o.key }; save(); render(); location.hash = d.id; };
      card.append(imgs, el("div", { class: "body" }, title, el("div", { class: "desc" }, o.desc), btn));
      grid.append(card);
    }
    const note = el("textarea", { placeholder: "Notes for " + d.id + " (optional): tweaks, mix-and-match…" });
    note.value = state[d.id]?.note || "";
    note.oninput = () => { state[d.id] = { ...(state[d.id] || {}), note: note.value }; save(); };
    sec.append(grid, note);
    main.append(sec);
  }
  progress();
}

function openLb(src) { const lb = $("#lb"), im = $("#lb img"); im.src = src; im.classList.remove("full"); lb.classList.add("on"); }
$("#lb").onclick = e => { const im = $("#lb img"); if (e.target === im && !im.classList.contains("full")) { im.classList.add("full"); e.stopPropagation(); } else $("#lb").classList.remove("on"); };
document.onkeydown = e => { if (e.key === "Escape") { $("#lb").classList.remove("on"); $("#export").classList.remove("on"); } };
for (const id of ["client", "theme"]) $("#" + id).onclick = e => { const b = e.target.closest("button"); if (!b) return; for (const x of $("#" + id).children) x.classList.toggle("on", x === b); if (id === "client") client = b.dataset.v; else theme = b.dataset.v; render(); };
$("#recommend").onclick = () => { for (const d of DATA.decisions) { const r = d.options.find(o => o.recommended); if (r && !state[d.id]?.pick) state[d.id] = { ...(state[d.id] || {}), pick: r.key }; } save(); render(); };
function exportText() {
  const out = { exported: new Date().toISOString(), choices: {} };
  for (const d of DATA.decisions) { const s = state[d.id] || {}; const o = d.options.find(o => o.key === s.pick); out.choices[d.id] = { title: d.title, pick: s.pick || null, option: o ? o.label : null, note: s.note || "" }; }
  return JSON.stringify(out, null, 2);
}
$("#exportBtn").onclick = () => { $("#exportText").value = exportText(); $("#export").classList.add("on"); };
$("#closeExport").onclick = () => $("#export").classList.remove("on");
$("#copy").onclick = () => { navigator.clipboard.writeText($("#exportText").value); $("#copy").textContent = "Copied"; };
$("#download").onclick = () => { const a = el("a", { href: URL.createObjectURL(new Blob([exportText()], { type: "application/json" })), download: "choices.json" }); a.click(); };
render();
</script>
