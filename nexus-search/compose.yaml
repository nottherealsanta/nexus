services:
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:18765/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Generate a secret in nexus-search/.env}
    volumes:
      - ./searxng:/etc/searxng:rw
