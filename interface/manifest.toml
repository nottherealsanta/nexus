# Nexus interface manifest. Single source of truth for the TUI and NSH.
# Schema, `when` vocabulary and keymap rules: interface/README.md.
# Validate: python3 interface/check_manifest.py
# Ids are stable. Renaming or removing one needs a PLAN.md ledger note.

manifest_version = 1
spec = "interface/design-language.md"

# --- Vocabulary -------------------------------------------------------------
# `when` terms must come from `terms`. A leading "!" negates a term.
# A command's `when` is a list; all terms must hold (AND).

[vocabulary]
terms = [
  "always",
  # workspace
  "has_project", "has_session", "has_turns",
  # session state (the session shown in the centre column)
  "session.idle", "session.busy", "session.interrupted",
  "session.archived", "session.child", "session.in_worktree",
  "session.continued", "session.continued_on",
  # waiting for user input
  "has_waiting", "waiting.approval", "waiting.question", "waiting.multiple",
  # composer and queue
  "composer.has_text", "composer.empty", "has_queued",
  # timeline and focus
  "timeline.scrolled_up", "timeline.has_older", "tool.output_clipped_in_ui",
  "focus.turn", "focus.tool", "focus.user_message", "focus.assistant_block",
  "focus.code_block", "focus.file", "focus.project", "focus.session_row",
  "focus.child_card", "focus.git_file",
  # views and overlays
  "panel.file", "panel.diff", "editor.dirty", "editor.readonly", "editor.markdown", "overlay.open", "dialog.open", "alert.open",
  "drawer.open", "layout.narrow",
  # connection and accounts
  "connection.lost", "connection.no_daemon", "provider.signed_in",
  "has_notifications", "text_edit.active", "view.settings",
  # Manager (docs/manager-design.md 10.1, 10.6). Only the Manager's own keys read these.
  "manager.in_call",       # a call is running (any client holds it)
  "manager.focused",       # the call takes the stage: large orb, dimmed app, and its keys
  "manager.minimised",     # the call is open but out of the way: small orb, app keys
  "manager.listening",     # the microphone is open in this call
  "manager.speaking",      # Manager speech is playing
  "manager.field",         # the one-line typed field is open above the orb
  "manager.card_focused",  # a focused card is up: it takes keys and has the scrim
  "manager.engaged",       # a focused call takes the keys, or the consent notice is open
]
placements = [
  "palette", "row_menu", "header", "composer", "sidebar", "timeline",
  "tool_line", "card", "toast", "banner", "dialog", "drawer", "panel",
  "settings", "menu",
  "stage",  # the Manager's orb, caption, typed field and card (10.1)
]
# `status`: absent = Core API ready. blocked_core = needs a Core increment
# (PLAN.md Steps 11/11a/12a); deferred = deliberately not built yet.
statuses = ["blocked_core", "deferred"]
categories = [
  "app", "auth", "appearance", "connection", "notifications", "navigation",
  "session", "sessions", "project", "composer", "model", "agent", "tools",
  "timeline", "tool", "waiting", "copy", "files", "editor", "git", "inspect",
  "dictation", "manager",
]

# --- Keymap ------------------------------------------------------------------
# Key syntax: lower-case, "+"-joined modifiers in the order cmd, ctrl, alt,
# shift, then the key ("ctrl+p", "cmd+alt+b", "esc", "enter", "space").
# `cmd` exists only in `keys.nsh` (macOS). NSH on other platforms maps cmd to
# ctrl at runtime. Each command's `key_context` scopes conflicts: two commands
# may share a key in different contexts, never within one (per client).
# Context "escape_chain" is special: Esc is resolved by [keymap.escape] below,
# not by per-command lookup.

[keymap]
contexts = [
  "global", "composer", "composer_busy", "timeline", "turn", "tool", "card",
  "waiting", "sidebar", "sidebar.sessions", "sidebar.files",
  "sidebar.projects", "sidebar.git", "editor", "drawer", "dialog",
  "manager.listening", "manager.field", "manager.card", "manager.focused",
  "escape_chain",
]

# Esc closes an interactive Manager dropdown, leaving audio and work running.
# With the dropdown closed, the normal session escape chain applies.
[[keymap.escape]]
id = "manager_call"
when = ["manager.focused"]
action = "manager.header"
note = "Close the Manager dropdown without ending audio, the control call or model work."

[[keymap.escape]]
id = "overlay"
when = ["overlay.open"]
action = "overlay.close"
note = "Palette, context menu, completion popup, tooltip: close it. Topmost first."

[[keymap.escape]]
id = "dialog"
when = ["dialog.open"]
action = "alert.cancel"
note = "Confirm/blocking dialogs cancel (a blocking version-mismatch dialog is not dismissable)."

[[keymap.escape]]
id = "text_edit"
when = ["text_edit.active"]
action = "text_edit.cancel"
note = "Inline rename, settings field, find bar, key capture: cancel the edit and keep focus. Composer text is NOT cleared by Esc."

[[keymap.escape]]
id = "drawer"
when = ["layout.narrow", "drawer.open"]
action = "nav.drawer.close"
note = "Narrow layout drawer closes; focus returns to what opened it."

[[keymap.escape]]
id = "alert"
when = ["alert.open"]
action = "alert.dismiss"
note = "Toast or banner with focus dismisses (it stays in the notifications drawer)."

[[keymap.escape]]
id = "interrupt"
when = ["session.busy", "!manager.focused"]
action = "session.interrupt"
note = "Interrupt the viewed session. Never also navigates back on the same press. An interactive Manager dropdown takes Esc first; background audio does not."

[[keymap.escape]]
id = "editor"
when = ["panel.file"]
action = "editor.close"
note = "Close the file panel (asks if dirty); the timeline underneath takes focus."

[[keymap.escape]]
id = "back"
when = ["session.child"]
action = "nav.back"
note = "Child session returns to its parent at the card position. Backspace does the same when no text field has focus."

[[keymap.escape]]
id = "settings"
when = ["view.settings"]
action = "app.settings"
note = "Settings view closes back to the previous centre view (app.settings toggles)."

[[keymap.escape]]
id = "refocus"
when = ["always"]
action = "composer.focus"
note = "Last resort: move focus to the composer. Never destructive."

# --- Navigation / screen map ----------------------------------------------------

[navigation.header]
leading = "sidebar.left.toggle"
centre = "title_breadcrumbs"
trailing = "sidebar.right.toggle"
manager_button = "manager.header"
note = "Toggles stay available when their sidebar is closed. Same anchors in terminal, browser and desktop, allowing for native window chrome."
title_click = "session.rename"
breadcrumbs = "root title > child title; each crumb is a link; back via nav.back"
extra = ["manager.header", "manager.open_session", "notifications.open"]

[navigation.left_sidebar]
default_tab = "sessions"
remember_tab_and_focus = true
settings_entry = "app.settings"
settings_position = "bottom_fixed"

[[navigation.left_sidebar.tab]]
id = "sessions"
label = "Sessions"
command = "sidebar.tab.sessions"
order = 1
[[navigation.left_sidebar.tab]]
id = "files"
label = "Files"
command = "sidebar.tab.files"
order = 2

[navigation.right_sidebar]
remember_focus = true
[[navigation.right_sidebar.section]]
id = "session_info"
label = "Session info"
order = 1
[[navigation.right_sidebar.section]]
id = "git_status"
label = "Git status"
order = 2

[navigation.centre]
# Exactly one centre view at a time.
views = ["session", "new_session", "settings"]
default = "session"
empty_project_view = "new_session"
first_run_view = "welcome_sign_in"
[navigation.centre.view_note]
session = "Timeline plus composer; a child session uses the same view with breadcrumbs and back."
new_session = "Starting context (agent, model, effort, directory, system prompt, AGENTS.md, tools, skills, MCP, token count) with the composer below."
settings = "Opened from app.settings (palette or fixed sidebar entry)."

[navigation.panel]
# One centred modal over the dimmed page. It shows a file (edit and diff views)
# or a Git change.
views = ["file", "diff"]
default = "file"
anchored = "centre"
note = "The page keeps its layout underneath; a click outside closes it, and long lines wrap."

[navigation.waiting_card]
position = "above_composer"
applies_to = ["session"]
note = "Approvals and questions are one component. Shows a count and cycles when several wait; waits inside children bubble up labelled with the child."

[navigation.narrow]
# Narrow = phone or small terminal; breakpoint is a client decision.
panes_at_once = 1
left_sidebar = "drawer"
right_sidebar = "drawer"
anchors_kept = true
notes = "Drawers open from the same header toggles; Esc or toggle closes; focus restores to the opener."

[navigation.notifications]
surface = "drawer"
command = "notifications.open"
order = "newest_first"
shows_unread_count = true

# --- Settings -----------------------------------------------------------------
# Section order is fixed (INTERFACE_PLAN.md): Appearance, Providers, Agents,
# Tools, MCP, Context, Voice and speech, Manager, Keybindings, Notifications, About.
# Rows keep their relative order in both clients; client-only rows are labelled
# by `clients` and sit inside the matching section.
# scope: core = read/written through the Core API; client = per-client view setting.
# kinds: choice, toggle, number, text, list, action, info, keymap.
# Settings shows the sections in a left rail and the selected section beside it in
# both clients. A section with `page = true` (Providers, Agents) renders its own
# content in that pane; Agents names open a detail page in the same pane.
# Rows that cannot be changed are left out of this file rather than shipped
# disabled: the manifest is the product, not a roadmap.

[settings.navigation]
section_key = "left"
value_key = "right"
previous_value_key = "shift+right"

[[settings.section]]
id = "appearance"
label = "Appearance"

[[settings.section.row]]
id = "appearance.theme"
label = "Theme"
kind = "choice"
scope = "client"
clients = "both"
default = "system"
options = ["system", "light", "dark"]
command = "app.theme"

[[settings.section.row]]
id = "appearance.monochrome"
label = "Monochrome mode"
kind = "toggle"
scope = "client"
clients = "tui"
default = false
note = "Meaning is preserved without colour."

[[settings.section.row]]
id = "appearance.animations"
label = "Animations"
kind = "toggle"
scope = "core"
clients = "both"
default = true
note = "Spinners and the working shimmer; off keeps an idle terminal still."

[[settings.section.row]]
id = "appearance.sidebar"
label = "Sidebar"
kind = "choice"
scope = "client"
clients = "both"
default = "full"
options = ["full", "rail"]
note = "The project rail always shows; this opens or closes the sidebar beside it. Drag the edge to resize."

[[settings.section.row]]
id = "appearance.timeline_detail"
label = "Timeline detail"
kind = "choice"
scope = "core"
clients = "both"
default = "medium"
options = ["low", "medium", "high"]
command = "timeline.detail_cycle"
note = "Low groups activity into one line, medium lists each tool collapsed, high expands every tool."

[[settings.section.row]]
id = "appearance.details"
label = "Details sidebar"
kind = "toggle"
scope = "client"
clients = "both"
default = false

[[settings.section.row]]
id = "appearance.session_scope"
label = "Sessions shown"
kind = "choice"
scope = "client"
clients = "both"
default = "this project"
options = ["this project", "all projects"]
command = "sessions.scope_toggle"

[[settings.section.row]]
id = "appearance.show_archived"
label = "Archived sessions"
kind = "toggle"
scope = "client"
clients = "both"
default = false
command = "sessions.archived_filter"

[[settings.section]]
id = "providers"
label = "Providers"
page = true
note = "Connection status per provider and ways to connect."

[[settings.section]]
id = "agents"
label = "Agents"
page = true
note = "Default agent and effort; models and fallbacks for subagents."

[[settings.section.row]]
id = "agents.default_root"
label = "Default agent for new sessions"
kind = "choice"
scope = "core"
clients = "both"

[[settings.section.row]]
id = "agents.default_effort"
label = "Default effort"
kind = "choice"
scope = "core"
clients = "both"
command = "model.effort"

[[settings.section]]
id = "tools"
label = "Tools"

[[settings.section.row]]
id = "tools.default_permission"
label = "Default permission"
kind = "choice"
scope = "core"
clients = "both"
options = ["allow", "ask"]
note = "For new sessions. Applies to bash, web_search and web_fetch; read-only and file tools never ask."

[[settings.section.row]]
id = "tools.defaults"
label = "Tools available to new sessions"
kind = "list"
scope = "core"
clients = "both"
command = "tools.configure"

[[settings.section]]
id = "mcp"
label = "MCP"

[[settings.section.row]]
id = "mcp.full_definitions"
label = "Full tool definitions in context"
kind = "toggle"
scope = "core"
clients = "both"
default = false
note = "Include every enabled MCP tool definition in new-session context."

[[settings.section.row]]
id = "mcp.max_listed_tools"
label = "Tools listed by name (limit)"
kind = "number"
scope = "core"
clients = "both"
default = 25
note = "1–1000; applies when full tool definitions are off."

[[settings.section]]
id = "context"
label = "Context"

[[settings.section.row]]
id = "context.usage_refresh_minutes"
label = "Refresh interval (minutes)"
kind = "number"
scope = "core"
clients = "both"
default = 10
note = "Refresh provider usage every 1–1440 minutes; refresh manually in the usage modal."

[[settings.section.row]]
id = "context.handoff_percent"
label = "Automatic handoff threshold (%)"
kind = "number"
scope = "core"
clients = "both"
default = 80
note = "0 turns the automatic handoff off. Core key [context] handoff_percent."

[[settings.section.row]]
id = "context.title_models"
label = "Title models"
kind = "text"
scope = "core"
clients = "both"
note = "provider/model refs separated by commas, tried in order to write a session title. Empty keeps the first words of the first message. Core key [context] title_models."

[[settings.section]]
id = "dictation"
label = "Voice and speech"

[[settings.section.row]]
id = "dictation.stt_model"
label = "Speech-to-text model"
kind = "info"
scope = "core"
clients = "both"
note = "State, repo, size and cache path from GET /api/voice (stt)."

[[settings.section.row]]
id = "dictation.stt_download"
label = "Download speech-to-text model"
kind = "action"
scope = "core"
clients = "both"
command = "voice.download_stt"

[[settings.section.row]]
id = "dictation.stt_remove"
label = "Remove speech-to-text model"
kind = "action"
scope = "core"
clients = "both"
command = "voice.remove_stt"

[[settings.section.row]]
id = "dictation.tts_model"
label = "Text-to-speech model"
kind = "info"
scope = "core"
clients = "both"
note = "State, repo, size and cache path from GET /api/voice (tts)."

[[settings.section.row]]
id = "dictation.tts_download"
label = "Download text-to-speech model"
kind = "action"
scope = "core"
clients = "both"
command = "voice.download_tts"

[[settings.section.row]]
id = "dictation.tts_remove"
label = "Remove text-to-speech model"
kind = "action"
scope = "core"
clients = "both"
command = "voice.remove_tts"

[[settings.section.row]]
id = "dictation.push_to_talk"
label = "Push-to-talk key"
kind = "keymap"
scope = "client"
clients = "both"
command = "voice.dictate"

[[settings.section]]
id = "manager"
label = "Manager"

[[settings.section.row]]
id = "manager.enabled"
label = "Manager on"
kind = "toggle"
scope = "core"
clients = "both"
default = false
note = "Off until the soak passes. Starting while off shows a toast that points here. Core key [manager] enabled."

[[settings.section.row]]
id = "manager.mode"
label = "Mode"
kind = "choice"
scope = "core"
clients = "both"
default = "pipeline"
options = ["pipeline", "live"]
note = "pipeline: speech to text, the Manager, then text to speech. live: GPT-Live over your ChatGPT sign-in (experimental); Core holds the call; the TUI and NSH web carry the microphone and speaker. NSH on iOS and desktop has no call audio yet and stays silent in this mode. Use headphones in the TUI. Core key [manager] mode."

[[settings.section.row]]
id = "manager.model"
label = "Model"
kind = "text"
scope = "core"
clients = "both"
default = "copilot/gpt-6-luna"
note = "provider/model ref. No fallback: a failure is spoken and shown. Core key [manager] model."

[[settings.section.row]]
id = "manager.proactive"
label = "Speak up unprompted"
kind = "choice"
scope = "core"
clients = "both"
default = "attention"
options = ["off", "attention", "all"]
note = "off: never. attention: approvals, questions and failures, spoken at a pause (docs/manager-design.md section 8). all: also finished sessions. A proactive line never moves the screen. Core key [manager] proactive."

[[settings.section.row]]
id = "manager.privacy"
label = "Where your words and sessions go"
kind = "info"
scope = "core"
clients = "both"
note = "Speech is transcribed and spoken by local models. What the Manager reads, including session text after redaction, goes to the model above (GitHub Copilot by default). Secrets are not spoken. Live mode would also send speech to OpenAI, and shows its own notice first."

[[settings.section]]
id = "keybindings"
label = "Keybindings"

[[settings.section.row]]
id = "keybindings.list"
label = "Command keys"
kind = "keymap"
scope = "client"
clients = "both"
note = "Every command in the manifest with an editable key; conflicts are refused per key_context."

[[settings.section]]
id = "notifications"
label = "Notifications"

[[settings.section.row]]
id = "notifications.sound"
label = "Notification sounds"
kind = "toggle"
scope = "client"
clients = "both"
default = true
note = "A rising cue when a root session and all its subagents have finished, and a higher cue when any session needs input. NEXUS_COMPLETION_SOUNDS=off disables both."

[[settings.section.row]]
id = "notifications.terminal"
label = "Terminal notifications"
kind = "choice"
scope = "client"
clients = "tui"
default = "waiting"
options = ["off", "waiting", "all"]
note = "Sent only for sessions out of view. waiting: approval or question; all adds finished turns and errors."

[[settings.section]]
id = "about"
label = "About"

[[settings.section.row]]
id = "about.versions"
label = "Client, Core and API versions"
kind = "info"
scope = "client"
clients = "both"

[[settings.section.row]]
id = "about.daemon"
label = "Daemon pid and home directory"
kind = "info"
scope = "core"
clients = "both"

[[settings.section.row]]
id = "about.inspector"
label = "Open inspector"
kind = "action"
scope = "client"
clients = "both"
command = "app.open_inspector"

# --- Commands -----------------------------------------------------------------
# `leader` is the Ctrl+X leader sequence old Nexus bound in the TUI. NSH's keymap
# takes one keystroke per binding, so commands.ts arms these for three seconds
# after Ctrl+X; `keys.nsh` keeps each command's direct shortcut too. Values use
# the key syntax above ("shift+n", "shift+/").

[[command]]
id = "palette.open"
title = "Command palette"
category = "app"
keys = { tui = "ctrl+p", nsh = "cmd+p" }
key_context = "global"
when = ["always"]
placement = ["header", "menu"]

[[command]]
id = "app.help_keys"
title = "Show keyboard shortcuts"
category = "app"
slash = "help"
keys = { tui = "f1", nsh = "cmd+/" }
leader = ["shift+/"]
key_context = "global"
when = ["always"]
placement = ["palette", "menu"]

[[command]]
id = "app.usage"
title = "Show provider usage"
category = "app"
slash = "usage"
keys = { tui = "ctrl+u", nsh = "cmd+shift+u" }
key_context = "global"
when = ["always"]
placement = ["palette", "menu"]
note = "Usage for every connected provider, with plan windows where reported (codex, copilot, opencode, grok, claude): GET /api/usage. Nothing here is a credential. In the TUI ctrl+u here wins over the composer's kill-to-line-start."

[[command]]
id = "app.quit"
title = "Quit"
category = "app"
keys = { tui = "ctrl+q", nsh = "cmd+q" }
key_context = "global"
when = ["always"]
placement = ["palette", "menu"]
note = "Quit closes the client only; the daemon keeps running."

[[command]]
id = "app.sign_in"
title = "Sign in to a provider"
category = "auth"
slash = "login"
when = ["always"]
placement = ["palette", "settings", "banner"]
note = "Each provider's rows offer its sign-in methods: a browser sign-in, a device code, the provider's CLI or a local server; OpenCode uses an API key."

[[command]]
id = "app.sign_out"
title = "Sign out of a provider"
category = "auth"
when = ["always"]
placement = ["palette", "settings"]

[[command]]
id = "app.open_inspector"
title = "Open inspector"
category = "inspect"
when = ["always"]
placement = ["palette", "sidebar", "menu"]
note = "Opens the inspector page for the current session, or the index with no session."

[[command]]
id = "app.theme"
title = "Change theme"
category = "appearance"
slash = "theme"
when = ["always"]
placement = ["palette", "settings"]

[[command]]
id = "app.settings"
title = "Open settings"
category = "navigation"
slash = "settings"
keys = { tui = "ctrl+,", nsh = "cmd+," }
leader = ["s"]
key_context = "global"
when = ["always"]
placement = ["palette", "sidebar", "menu"]

[[command]]
id = "app.reconnect"
title = "Reconnect to Core"
category = "connection"
leader = ["r"]
when = ["connection.lost"]
unavailable_reason = "Core is connected."
placement = ["palette", "banner"]

[[command]]
id = "app.start_daemon"
title = "Start Nexus Core"
category = "connection"
when = ["connection.no_daemon"]
unavailable_reason = "A Core daemon is already running."
placement = ["palette", "banner"]

[[command]]
id = "notifications.open"
title = "Notifications"
category = "notifications"
slash = "notifications"
keys = { nsh = "cmd+shift+n" }
leader = ["shift+n"]
key_context = "global"
when = ["always"]
placement = ["palette", "header"]

[[command]]
id = "notifications.mark_all_read"
title = "Mark all notifications read"
category = "notifications"
when = ["has_notifications"]
unavailable_reason = "There are no notifications."
placement = ["palette", "drawer"]

[[command]]
id = "alert.dismiss"
title = "Dismiss alert"
category = "notifications"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["alert.open"]
unavailable_reason = "No alert is open."
placement = ["toast", "banner"]

[[command]]
id = "alert.confirm"
title = "Confirm"
category = "notifications"
keys = { tui = "enter", nsh = "enter" }
key_context = "dialog"
when = ["dialog.open"]
unavailable_reason = "No confirmation is open."
placement = ["dialog"]

[[command]]
id = "alert.cancel"
title = "Cancel"
category = "notifications"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["dialog.open"]
unavailable_reason = "No dialog is open."
placement = ["dialog"]

[[command]]
id = "sidebar.left.toggle"
title = "Toggle left sidebar"
category = "navigation"
keys = { tui = "ctrl+b", nsh = "cmd+b" }
key_context = "global"
when = ["always"]
placement = ["palette", "header", "menu"]
note = "Leading edge of the workspace header; stays visible when the sidebar is closed."

[[command]]
id = "sidebar.right.toggle"
title = "Toggle right sidebar"
category = "navigation"
keys = { tui = "alt+b", nsh = "cmd+alt+b" }
leader = ["l"]
key_context = "global"
when = ["always"]
placement = ["palette", "header", "menu"]
note = "Trailing edge of the workspace header; stays visible when the sidebar is closed."

[[command]]
id = "sidebar.tab.sessions"
title = "Sidebar: Sessions"
category = "navigation"
keys = { tui = "alt+1", nsh = "cmd+1" }
key_context = "global"
when = ["always"]
placement = ["palette", "sidebar"]

[[command]]
id = "sidebar.tab.files"
title = "Sidebar: Files"
category = "navigation"
keys = { tui = "alt+2", nsh = "cmd+2" }
key_context = "global"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["palette", "sidebar"]

[[command]]
id = "sidebar.tab.projects"
title = "Sidebar: Projects"
category = "navigation"
keys = { tui = "alt+3", nsh = "cmd+3" }
key_context = "global"
when = ["always"]
placement = ["palette", "sidebar"]

[[command]]
id = "sidebar.focus"
title = "Focus sidebar"
category = "navigation"
keys = { tui = "alt+h", nsh = "cmd+0" }
key_context = "global"
when = ["always"]
placement = ["palette"]

[[command]]
id = "composer.focus"
title = "Focus composer"
category = "navigation"
keys = { tui = "alt+l", nsh = "cmd+l" }
key_context = "global"
when = ["always"]
placement = ["palette"]

[[command]]
id = "timeline.focus"
title = "Focus timeline"
category = "navigation"
keys = { tui = "alt+k", nsh = "cmd+j" }
key_context = "global"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette"]

[[command]]
id = "nav.back"
title = "Back to parent session"
category = "navigation"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["session.child"]
unavailable_reason = "Not viewing a child session."
placement = ["header", "palette"]
note = "Backspace also goes back when no text field has focus. Returns to the parent at the child card's position."

[[command]]
id = "nav.drawer.close"
title = "Close drawer"
category = "navigation"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["layout.narrow", "drawer.open"]
unavailable_reason = "No drawer is open."
placement = ["drawer"]

[[command]]
id = "overlay.close"
title = "Close menu, palette or popup"
category = "navigation"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["overlay.open"]
unavailable_reason = "Nothing to close."
placement = ["palette", "menu"]

[[command]]
id = "session.new"
title = "New session"
category = "session"
slash = "new"
keys = { tui = "ctrl+n", nsh = "cmd+n" }
leader = ["n"]
key_context = "global"
when = ["has_project"]
unavailable_reason = "Add or choose a project first."
placement = ["palette", "sidebar", "menu"]

[[command]]
id = "session.open"
title = "Open session"
category = "session"
keys = { tui = "enter", nsh = "enter" }
key_context = "sidebar.sessions"
when = ["focus.session_row"]
unavailable_reason = "Focus a session row first."
placement = ["sidebar"]

[[command]]
id = "session.switch"
title = "Switch session"
category = "session"
slash = "sessions"
keys = { tui = "ctrl+k", nsh = "cmd+k" }
leader = ["o", "b"]
key_context = "global"
when = ["has_project"]
unavailable_reason = "Add or choose a project first."
placement = ["palette"]

[[command]]
id = "project.switch"
title = "Switch project"
category = "project"
slash = "project"
keys = { tui = "alt+p", nsh = "cmd+shift+k" }
key_context = "global"
when = ["always"]
placement = ["palette", "sidebar"]

[[command]]
id = "session.search"
title = "Search sessions"
category = "session"
slash = "search"
keys = { tui = "ctrl+f", nsh = "cmd+shift+f" }
key_context = "sidebar.sessions"
when = ["always"]
placement = ["palette", "sidebar"]
note = "Matches titles and user messages only (Core index)."

[[command]]
id = "session.tab_close"
title = "Close tab"
category = "session"
slash = "close"
keys = { tui = "alt+x", nsh = "alt+x" }
key_context = "global"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette", "header"]
note = "Closes the session's tab; the session itself stays in the list."

[[command]]
id = "session.tab_next"
title = "Next tab"
category = "session"
keys = { tui = "alt+]", nsh = "alt+]" }
key_context = "global"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette", "header"]

[[command]]
id = "session.tab_prev"
title = "Previous tab"
category = "session"
keys = { tui = "alt+[", nsh = "alt+[" }
key_context = "global"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette", "header"]

[[command]]
id = "session.rename"
title = "Rename session"
category = "session"
slash = "rename"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette", "row_menu", "header"]
note = "Also by clicking the title in the header."

[[command]]
id = "session.archive"
title = "Archive session"
category = "session"
when = ["has_session", "!session.archived", "!session.busy"]
unavailable_reason = "Archiving needs an idle or interrupted session that is not already archived (a busy descendant also blocks it)."
placement = ["palette", "row_menu"]

[[command]]
id = "session.unarchive"
title = "Unarchive session"
category = "session"
when = ["has_session", "session.archived"]
unavailable_reason = "This session is not archived."
placement = ["palette", "row_menu"]

[[command]]
id = "session.delete"
title = "Delete session"
category = "session"
when = ["has_session", "!session.busy"]
unavailable_reason = "Interrupt the session before deleting it."
placement = ["palette", "row_menu"]
note = "Confirm; names the number of child sessions removed. No undo."

[[command]]
id = "session.export"
title = "Export session"
category = "session"
slash = "export"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette", "row_menu"]
note = "Dialog: Markdown transcript or JSON (messages and events)."

[[command]]
id = "session.handoff"
title = "Hand off to a new session"
category = "session"
slash = "compact"
slash_aliases = ["handoff"]
when = ["has_session", "session.idle"]
unavailable_reason = "Hand-off needs an idle session."
placement = ["palette", "header"]
note = "POST /api/session/{id}/handoff: Core writes a summary, starts a new root session of the same agent that begins with it and the client opens it. Core also does this by itself after a turn that fills [context] handoff_percent (event session.handoff, reason auto). The continued session shows the summary as a 3-line box; Enter or a click opens all of it."

[[command]]
id = "session.open_origin"
title = "Open the session this one continued from"
category = "session"
slash = "origin"
when = ["session.continued"]
unavailable_reason = "This session was not started by a handoff."
placement = ["palette", "composer"]
note = "Session JSON `continued_from` (cleared when the original is deleted); the handoff card names it."

[[command]]
id = "session.open_continuation"
title = "Open the session continued from this one"
category = "session"
slash = "continuation"
when = ["session.continued_on"]
unavailable_reason = "No handoff was made from this session."
placement = ["palette", "composer"]
note = "Session JSON `continued_to`: the newest session whose handoff started from this one."

[[command]]
id = "session.change_directory"
title = "Change session directory"
category = "session"
slash = "cd"
when = ["has_session", "session.idle"]
unavailable_reason = "Directory changes apply after active tools finish; wait for the turn."
placement = ["palette"]

[[command]]
id = "session.worktrees"
title = "Worktrees"
category = "session"
slash = "worktree"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette"]

[[command]]
id = "session.resources"
title = "Kernels and shells"
category = "session"
slash = "resources"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette"]

[[command]]
id = "session.worktree.integrate"
title = "Integrate or merge a worktree"
category = "session"
when = ["session.in_worktree"]
unavailable_reason = "Integrate/merge is deferred; leaving a worktree is TBD."
placement = ["palette"]
status = "deferred"

[[command]]
id = "session.interrupt"
title = "Interrupt"
category = "session"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["session.busy"]
unavailable_reason = "Nothing is running."
placement = ["palette", "composer"]
note = "Esc interrupts the turn; its pending steers and queued messages come back to the composer, joined by a newline."

[[command]]
id = "session.continue"
title = "Continue"
category = "session"
slash = "continue"
when = ["session.interrupted"]
unavailable_reason = "Continue is offered after an interrupted or failed turn; not while a turn is running."
placement = ["palette", "composer", "timeline"]

[[command]]
id = "session.speak"
title = "Speak the latest answer"
category = "session"
slash = "speak"
when = ["has_session", "session.idle"]
unavailable_reason = "Speaking needs an idle session with a completed answer."
placement = ["palette", "composer"]
note = "Core synthesizes the final answer with the cached TTS model and streams a WAV; the client plays it."

[[command]]
id = "session.speak_stop"
title = "Stop speaking"
category = "session"
when = ["has_session"]
unavailable_reason = "Nothing is being spoken."
placement = ["palette"]

[[command]]
id = "session.send"
title = "Send message"
category = "composer"
keys = { tui = "enter", nsh = "enter" }
key_context = "composer"
when = ["composer.has_text", "session.idle"]
unavailable_reason = "Type a message first."
placement = ["composer"]

[[command]]
id = "composer.steer"
title = "Send as steering message"
category = "composer"
keys = { tui = "enter", nsh = "enter" }
key_context = "composer_busy"
when = ["composer.has_text", "session.busy"]
unavailable_reason = "Steering needs a running turn."
placement = ["palette", "composer"]
note = "Enter steers at the next model step."

[[command]]
id = "composer.queue"
title = "Queue message for next turn"
category = "composer"
keys = { tui = "tab", nsh = "tab" }
key_context = "composer_busy"
when = ["composer.has_text", "session.busy"]
unavailable_reason = "Queueing needs a running turn."
placement = ["palette", "composer"]
note = "Tab queues the next turn while busy."

[[command]]
id = "composer.newline"
title = "Insert newline"
category = "composer"
keys = { tui = "shift+enter", nsh = "shift+enter" }
key_context = "composer"
when = ["always"]
placement = ["composer"]
note = "TUI falls back to ctrl+j where the terminal cannot report shift+enter."

[[command]]
id = "composer.undo"
title = "Undo composer edit"
category = "composer"
keys = { tui = "ctrl+z" }
key_context = "composer"
when = ["always"]
placement = ["palette"]

[[command]]
id = "composer.redo"
title = "Redo composer edit"
category = "composer"
keys = { tui = "ctrl+y" }
key_context = "composer"
when = ["always"]
placement = ["palette"]
note = "Ctrl+Shift+Z also redoes in the TUI."

[[command]]
id = "queue.edit"
title = "Edit queued message"
category = "composer"
when = ["has_queued"]
unavailable_reason = "No queued messages."
placement = ["composer"]
status = "blocked_core"

[[command]]
id = "queue.remove"
title = "Remove queued message"
category = "composer"
when = ["has_queued"]
unavailable_reason = "No queued messages."
placement = ["composer"]
status = "blocked_core"

[[command]]
id = "session.btw"
title = "Ask a side question"
category = "session"
slash = "btw"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette", "composer"]
note = "`/btw question`: one request with the session's context up to its last completed tool call, no tools. POST /api/session/{id}/btw. The answer is an overlay; nothing enters the session's context."

[[command]]
id = "session.jump_latest"
title = "Jump to latest"
category = "timeline"
keys = { tui = "end", nsh = "cmd+down" }
key_context = "timeline"
when = ["has_session", "timeline.scrolled_up"]
unavailable_reason = "Already following the latest item."
placement = ["timeline", "palette"]

[[command]]
id = "session.open_inspector"
title = "Open session in inspector"
category = "inspect"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette", "row_menu", "header"]

[[command]]
id = "session.wire_toggle"
title = "Toggle wire view"
category = "inspect"
slash = "wire"
keys = { tui = "ctrl+w", nsh = "cmd+shift+w" }
key_context = "global"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette"]

[[command]]
id = "session.copy_id"
title = "Copy session id"
category = "copy"
slash = "copy-session-id"
when = ["has_session"]
unavailable_reason = "Open a session first."
placement = ["palette", "row_menu", "sidebar"]

[[command]]
id = "session.child.open"
title = "Open child session"
category = "session"
keys = { tui = "enter", nsh = "enter" }
key_context = "card"
when = ["focus.child_card"]
unavailable_reason = "Focus a child card first."
placement = ["card"]

[[command]]
id = "model.change"
title = "Change model"
category = "model"
slash = "model"
keys = { tui = "ctrl+m", nsh = "cmd+shift+m" }
leader = ["m"]
key_context = "global"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["palette", "composer"]
note = "Warns about cache invalidation first. Applies from the next model call."

[[command]]
id = "model.effort"
title = "Change effort"
category = "model"
slash = "effort"
leader = ["t"]
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["palette", "composer"]

[[command]]
id = "agent.change"
keys = { tui = "ctrl+g" }
leader = ["g"]
key_context = "global"
title = "Change agent"
category = "agent"
slash = "agent"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["palette", "composer"]
note = "Warns: the system prompt changes."

[[command]]
id = "tools.configure"
title = "Tools"
category = "tools"
slash = "tools"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["palette", "sidebar"]

[[command]]
id = "skills.configure"
title = "Skills"
category = "tools"
slash = "skills"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["palette"]
status = "blocked_core"

[[command]]
id = "skills.learn"
title = "Learn skills"
category = "tools"
slash = "learn"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["palette", "composer"]
note = "/learn owner/repo, a GitHub URL, ./folder, or `npx skills add …`: copies the skills, no npx. Asks project or global."

[[command]]
id = "mcp.configure"
title = "MCP servers"
category = "tools"
slash = "mcp"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["palette"]
status = "blocked_core"

[[command]]
id = "turn.fold_toggle"
title = "Fold or unfold turn"
category = "timeline"
keys = { tui = "space", nsh = "space" }
key_context = "turn"
when = ["has_turns", "focus.turn"]
unavailable_reason = "Focus a turn first."
placement = ["timeline", "palette"]

[[command]]
id = "turn.fold_all_but_last"
title = "Fold all turns but the last"
category = "timeline"
keys = { tui = "alt+z", nsh = "cmd+alt+z" }
key_context = "global"
when = ["has_turns"]
unavailable_reason = "No turns yet."
placement = ["palette"]

[[command]]
id = "turn.unfold_all"
title = "Unfold all turns"
category = "timeline"
when = ["has_turns"]
unavailable_reason = "No turns yet."
placement = ["palette"]

[[command]]
id = "turn.go_to"
title = "Go to turn"
category = "timeline"
slash = "turn"
keys = { nsh = "cmd+g" }
key_context = "global"
when = ["has_turns"]
unavailable_reason = "No turns yet."
