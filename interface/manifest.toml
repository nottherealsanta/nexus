when = ["waiting.multiple"]
unavailable_reason = "Only one item is waiting."
placement = ["card"]

[[command]]
id = "waiting.prev"
title = "Previous waiting item"
category = "waiting"
keys = { tui = "shift+tab", nsh = "cmd+shift+[" }
key_context = "waiting"
when = ["waiting.multiple"]
unavailable_reason = "Only one item is waiting."
placement = ["card"]

[[command]]
id = "waiting.focus"
title = "Focus waiting card"
category = "waiting"
keys = { tui = "alt+w", nsh = "cmd+alt+w" }
key_context = "global"
when = ["has_waiting"]
unavailable_reason = "Nothing is waiting for input."
placement = ["palette"]
[[command]]
id = "text_edit.cancel"
title = "Cancel text edit"
category = "navigation"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["text_edit.active"]
unavailable_reason = "No text field is being edited."
placement = ["editor", "settings"]
note = "Inline rename, find bar, settings field, key capture. Not the composer: Esc never clears composer text."

