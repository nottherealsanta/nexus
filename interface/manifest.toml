# --- Commands -----------------------------------------------------------------

[[command]]
id = "palette.open"
title = "Command palette"
category = "app"
keys = { tui = "ctrl+p", nsh = "cmd+p" }
key_context = "global"
when = ["always"]
placement = ["header", "menu"]

[[command]]
id = "app.help_keys"
title = "Show keyboard shortcuts"
category = "app"
slash = "help"
keys = { tui = "f1", nsh = "cmd+/" }
key_context = "global"
when = ["always"]
placement = ["palette", "menu"]

[[command]]
id = "app.quit"
title = "Quit"
category = "app"
keys = { tui = "ctrl+q", nsh = "cmd+q" }
key_context = "global"
when = ["always"]
placement = ["palette", "menu"]
note = "Quit closes the client only; the daemon keeps running."

[[command]]
