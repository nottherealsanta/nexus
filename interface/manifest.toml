when = ["has_turns"]
unavailable_reason = "No turns yet."
placement = ["palette"]

[[command]]
id = "turn.next"
title = "Next turn"
category = "timeline"
keys = { tui = "]", nsh = "cmd+]" }
key_context = "timeline"
when = ["has_turns"]
unavailable_reason = "No turns yet."
placement = ["palette"]

[[command]]
id = "turn.load_older"
title = "Load older turns"
category = "timeline"
when = ["timeline.has_older"]
unavailable_reason = "All turns are loaded."
placement = ["timeline", "palette"]

[[command]]
id = "tool.expand_toggle"
title = "Expand or collapse tool"
category = "tool"
keys = { tui = "enter", nsh = "enter" }
key_context = "tool"
when = ["focus.tool"]
unavailable_reason = "Focus a tool line first."
placement = ["tool_line"]

[[command]]
id = "tool.raw_toggle"
title = "Show raw arguments and result"
category = "tool"
keys = { tui = "r", nsh = "r" }
key_context = "tool"
when = ["focus.tool"]
unavailable_reason = "Focus a tool line first."
placement = ["tool_line"]

[[command]]
id = "timeline.detail_cycle"
title = "Cycle detail level"
category = "timeline"
slash = "detail"
keys = { tui = "alt+d", nsh = "alt+d" }
key_context = "global"
when = ["always"]
placement = ["palette", "timeline"]
note = "Low: each activity group is one line (`1 command, 2 reads`). Medium: every tool on its own collapsed line with its key detail. High: every tool expanded, long output capped to its first and last lines (`o` shows all)."

[[command]]
id = "tool.show_all_output"
title = "Show all output"
category = "tool"
keys = { tui = "o", nsh = "o" }
key_context = "tool"
when = ["focus.tool", "tool.output_clipped_in_ui"]
unavailable_reason = "Output is not clipped in the UI."
placement = ["tool_line"]

[[command]]
id = "tool.open_inspector"
title = "Open in inspector"
category = "inspect"
keys = { tui = "i", nsh = "i" }
key_context = "tool"
when = ["focus.tool"]
unavailable_reason = "Focus a tool line first."
placement = ["tool_line"]

[[command]]
id = "waiting.go_to"
title = "Go to waiting session"
category = "waiting"
when = ["has_waiting"]
unavailable_reason = "Nothing is waiting for input."
placement = ["palette", "banner", "drawer"]

[[command]]
id = "copy.user_message"
title = "Copy user message"
category = "copy"
when = ["focus.user_message"]
unavailable_reason = "Focus a user message first."
placement = ["palette", "timeline"]
note = "Uses OSC 52 in the TUI, system clipboard in NSH."

[[command]]
id = "copy.final_message"
title = "Copy final message of turn"
category = "copy"
keys = { tui = "y" }
key_context = "timeline"
when = ["has_turns"]
unavailable_reason = "No turns yet."
placement = ["palette", "timeline"]

[[command]]
id = "copy.assistant_block"
title = "Copy assistant text"
category = "copy"
when = ["focus.assistant_block"]
unavailable_reason = "Focus an assistant block first."
placement = ["palette", "timeline"]

[[command]]
id = "copy.code_block"
