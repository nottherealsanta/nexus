[[command]]
id = "text_edit.cancel"
title = "Cancel text edit"
category = "navigation"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["text_edit.active"]
unavailable_reason = "No text field is being edited."
placement = ["panel", "settings"]
note = "Inline rename, find bar, settings field, key capture. Not the composer: Esc never clears composer text."

# --- Manager -------------------------------------------------------------------
# The voice agent above all sessions (docs/manager-design.md 10.1 to 10.7). Nothing here
# is captured at rest except manager.talk, start, stop and the four call actions.
# A focused call takes the stage and its keys; a minimised call leaves the app's
# bare keys alone except Esc, which ends the call. Esc is resolved by
# [[keymap.escape]] above.
# Digits 1-9 pick a row of a focused card; any printable character opens the field
# (manager.field_open). Both are client behaviour, so they carry no key here.

[[command]]
id = "manager.details_up"
title = "Scroll Manager details up"
category = "manager"
keys = { tui = "pageup", nsh = "pageup" }
key_context = "manager.focused"
when = ["manager.focused", "!manager.field"]
unavailable_reason = "Open the focused Manager call to scroll its details."
placement = ["stage"]

[[command]]
id = "manager.details_down"
title = "Scroll Manager details down"
category = "manager"
keys = { tui = "pagedown", nsh = "pagedown" }
key_context = "manager.focused"
when = ["manager.focused", "!manager.field"]
unavailable_reason = "Open the focused Manager call to scroll its details."
placement = ["stage"]

[[command]]
id = "manager.header"
title = "Manager"
category = "manager"
when = ["always"]
placement = ["header", "palette"]
note = "Toggle the borderless opaque Manager dropdown. The header orb replaces the label while visible. Voice defaults on: explicitly opening Manager starts audio immediately unless Voice was switched off. Esc closes the dropdown."

[[command]]
id = "manager.audio_toggle"
title = "Toggle Manager audio"
category = "manager"
when = ["always"]
placement = ["header", "palette"]
note = "The dropdown Voice toggle defaults on. Switching it on starts GPT-Live immediately; switching it off stops only audio. The header orb toggles the dropdown; debug session navigation remains independent."

[[command]]
id = "manager.context"
title = "Manager context"
category = "manager"
when = ["always"]
placement = ["palette", "header"]
note = "A palette debug command. Opens a read-only, scrollable modal with the Manager's current hidden context: its episodes and recap, the state snapshot and deltas it was given each turn, and its recent log (messages, tool calls and results). It is an inspector-style debug view, not a timeline or chat (docs/manager.md). Clipping is announced. Available with or without a call."

[[command]]
id = "manager.open_session"
title = "Open Manager session"
category = "manager"
slash = "manager-session"
when = ["always"]
placement = ["palette"]
note = "Ensure and open the current persistent backend Manager session inside Nexus, read-only for debugging. Creates no model or audio call; reconnecting audio reuses the session. Follow existing episode rollover."

[[command]]
id = "manager.talk"
title = "Talk to the Manager"
category = "manager"
keys = { tui = "alt+m", nsh = "cmd+shift+space" }
key_context = "global"
when = ["always"]
placement = ["palette"]
note = "Tap to toggle, in both clients (terminals do not report key release). No call: start one, focus it and open the mic. Focused call: listening sends; thinking, speaking or idle barge in (stop speech, cancel the turn if safe, open the mic). Minimised call: bring the orb back and do the same; with a card waiting it opens that card. Space does the same while the call is focused. Clicking the orb does the same, so talking over the Manager barges in."

[[command]]
id = "manager.start"
title = "Start the Manager"
category = "manager"
slash = "manager"
when = ["always"]
placement = ["palette"]
note = "Starts the call, or moves it to this client (POST /api/manager/start), with its dropdown closed. `/manager <text>` sends one typed line instead and opens the dropdown. With enabled = false, shows a toast that points at Settings, Manager. `/manager stop` is manager.stop."

[[command]]
id = "manager.stop"
title = "Stop the Manager"
category = "manager"
slash = "manager-stop"
keys = { tui = "alt+shift+m", nsh = "cmd+alt+shift+space" }
key_context = "global"
when = ["manager.in_call"]
unavailable_reason = "No Manager call is running."
placement = ["palette"]
note = "Typed as `/manager stop`. The composer reads a leading `stop` after /manager as this command (no space is allowed in a slash name, so `/manager-stop` is the registered form). Ends the call (POST /api/manager/stop). The End button under the orb does the same, and so does saying \"that's all\". Never stops a session, stops speech or dismisses a card as a side effect."

[[command]]
id = "manager.minimise"
title = "Minimise the Manager call"
category = "manager"
when = ["manager.focused"]
unavailable_reason = "No Manager call is focused."
placement = ["palette"]
note = "The call stays open: the orb shrinks to the bottom-right corner, the app returns to full strength and gets its keys back. A recording is dropped and the typed field closes; speech and the Manager's turn keep going. Esc is not this: Esc ends the whole call (manager.stop)."

[[command]]
id = "manager.send"
title = "Send what you said"
category = "manager"
keys = { tui = "enter", nsh = "enter" }
key_context = "manager.listening"
when = ["manager.listening"]
unavailable_reason = "The microphone is not open."
placement = ["stage"]
note = "Listening: enter sends. Space also sends (client), and so does manager.talk."

[[command]]
id = "manager.listen_cancel"
title = "Cancel listening"
category = "manager"
when = ["manager.listening"]
unavailable_reason = "The microphone is not open."
placement = ["stage"]
note = "Drops the recording; nothing is sent. The call stays open. Esc ends the whole call instead."

[[command]]
id = "manager.speech_stop"
title = "Stop speaking"
category = "manager"
keys = { tui = "alt+s", nsh = "cmd+shift+s" }
key_context = "global"
when = ["manager.in_call", "manager.speaking"]
unavailable_reason = "The Manager is not speaking."
placement = ["stage"]
note = "Stops the speech only; the Manager's turn keeps working and its later sentences are shown but not spoken. Distinct from cancelling the turn (manager.turn_cancel) and ending the call (manager.stop). Esc ends the whole call instead."

[[command]]
id = "manager.turn_cancel"
title = "Cancel the Manager's turn"
category = "manager"
keys = { tui = "alt+c", nsh = "cmd+shift+c" }
key_context = "global"
when = ["manager.in_call"]
unavailable_reason = "No Manager call is running."
placement = ["stage"]
note = "POST /api/manager/cancel: stops the current speech and cancels the Manager's turn only if no tool has changed a session yet; otherwise the turn keeps going and the response says so. Distinct from stop speaking, dismissing a card and ending the call. Talk (Space or manager.talk) barges in with the same cancel and then opens the mic."

[[command]]
id = "manager.field_open"
title = "Type to the Manager"
category = "manager"
when = ["manager.engaged"]
unavailable_reason = "The Manager is not listening and no card is focused."
placement = ["stage"]
note = "Any printable character opens the one-line field above the orb with that character in it, and discards the recording. Keys go to the field, not the session composer. Spoken and typed lines are one conversation."

[[command]]
id = "manager.field_send"
title = "Send typed line"
category = "manager"
keys = { tui = "enter", nsh = "enter" }
key_context = "manager.field"
when = ["manager.field"]
unavailable_reason = "The typed field is not open."
placement = ["stage"]
note = "Enter sends the typed line into the Manager's conversation."

[[command]]
id = "manager.field_close"
title = "Close typed line"
category = "manager"
when = ["manager.field"]
unavailable_reason = "The typed field is not open."
placement = ["stage"]
note = "Closes the field and drops its text. Nothing is sent. Esc ends the whole call instead."

[[command]]
id = "manager.card_pick"
title = "Pick a card row"
category = "manager"
when = ["manager.card_focused"]
unavailable_reason = "No card is focused."
placement = ["stage"]
note = "Digits 1-9 pick the row with that number (rows are numbered across the whole card). It opens the session through the normal navigation and closes the card. A session that no longer exists says so in the caption."

[[command]]
id = "manager.card_mic"
title = "Open the mic from a card"
category = "manager"
keys = { tui = "space", nsh = "space" }
key_context = "manager.card"
when = ["manager.card_focused"]
unavailable_reason = "No card is focused."
placement = ["stage"]
note = "Space opens the mic while a focused card is up, so the user can answer it by voice."

[[command]]
id = "manager.card_dismiss"
title = "Dismiss card"
category = "manager"
keys = { tui = "alt+shift+d", nsh = "cmd+alt+shift+d" }
key_context = "global"
when = ["manager.card_focused"]
unavailable_reason = "No card is focused."
placement = ["stage"]
note = "Closes the card (POST /api/manager/card/dismiss); the next turn's delta says so. A click outside the card does the same. Distinct from minimising the call (which keeps the card) and ending the call (which Esc does)."
