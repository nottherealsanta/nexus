[[command]]
id = "composer.slash_menu"
title = "Slash command completion"
category = "composer"
keys = { tui = "/", nsh = "/" }
key_context = "composer"
when = ["composer.empty"]
unavailable_reason = "Slash completion opens at the start of an empty composer."
placement = ["composer"]

