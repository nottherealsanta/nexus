[[command]]
id = "copy.file_path"
title = "Copy file path"
category = "copy"
when = ["focus.file"]
unavailable_reason = "Focus a file first."
placement = ["palette", "timeline"]

[[command]]
id = "file.open_editor"
title = "Open in built-in editor"
category = "files"
keys = { tui = "enter", nsh = "enter" }
key_context = "sidebar.files"
when = ["focus.file"]
unavailable_reason = "Focus a file first."
placement = ["sidebar", "palette"]

[[command]]
id = "file.open_external"
title = "Open in external editor"
category = "files"
when = ["focus.file"]
unavailable_reason = "Focus a file first."
