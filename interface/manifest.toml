[[command]]
id = "sessions.scope_toggle"
title = "Sessions: current project or all projects"
category = "sessions"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["sidebar", "palette"]

[[command]]
id = "sessions.archived_filter"
title = "Sessions: show archived"
category = "sessions"
when = ["has_project"]
unavailable_reason = "Open a project first."
placement = ["sidebar", "palette"]

[[command]]
id = "project.add"
