[[command]]
id = "project.open"
title = "Open project"
category = "project"
keys = { tui = "enter", nsh = "enter" }
key_context = "sidebar.projects"
when = ["focus.project"]
unavailable_reason = "Focus a project first."
placement = ["sidebar"]

[[command]]
id = "editor.edit"
title = "Edit file"
category = "editor"
keys = { tui = "e", nsh = "cmd+e" }
key_context = "editor"
when = ["panel.file", "editor.readonly"]
unavailable_reason = "No file is open, or it is already being edited."
placement = ["panel", "palette"]
note = "Turns the file view into the editor. Saving writes with the revision the file was read at (PUT, K10)."

[[command]]
id = "editor.save"
title = "Save file"
category = "editor"
keys = { tui = "ctrl+s", nsh = "cmd+s" }
key_context = "editor"
when = ["panel.file", "editor.dirty"]
unavailable_reason = "No unsaved changes."
placement = ["panel", "palette"]
note = "Refused if the file changed on disk; reload first, unsaved text is preserved."

[[command]]
id = "editor.find"
title = "Find in file"
category = "editor"
keys = { tui = "ctrl+f", nsh = "cmd+f" }
key_context = "editor"
when = ["panel.file"]
unavailable_reason = "No file is open."
placement = ["panel", "palette"]

[[command]]
id = "editor.preview"
title = "Toggle Markdown preview"
category = "editor"
keys = { tui = "p", nsh = "cmd+shift+p" }
key_context = "editor"
when = ["panel.file", "editor.readonly", "editor.markdown"]
unavailable_reason = "No Markdown file is open, or the file is being edited."
placement = ["panel", "palette"]
note = "Renders Markdown files as prose; the source keeps line numbers and find."

[[command]]
id = "editor.reload"
title = "Reload file from disk"
category = "editor"
when = ["panel.file"]
unavailable_reason = "No file is open."
placement = ["panel", "palette"]

[[command]]
id = "editor.close"
title = "Close editor"
category = "editor"
keys = { tui = "esc", nsh = "esc" }
key_context = "escape_chain"
when = ["panel.file"]
unavailable_reason = "No file is open."
placement = ["panel", "palette"]
note = "Asks first if the file is dirty."

[[command]]
id = "git.open_diff"
title = "Open diff"
category = "git"
keys = { tui = "enter", nsh = "enter" }
key_context = "sidebar.git"
when = ["focus.git_file"]
unavailable_reason = "Focus a changed file first."
placement = ["sidebar"]

