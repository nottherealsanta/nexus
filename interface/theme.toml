# Nexus design language: semantic tokens shared by the TUI and NSH.
# Source of truth for colour. Spec: interface/design-language.md.
# Check with: python3 interface/check_theme.py
#
# Values that are not "#rrggbb" are token references ("surface.panel").
# Hairline borders (border.default) are decoration and are exempt from the
# 3:1 rule; every mark that carries meaning (focus, status, accent) is not.

[meta]
version = 1
themes = ["dark", "light"]
# Minimum contrast ratios enforced by check_theme.py.
text_min = 4.5          # text.primary / secondary / muted, role text, status text
nontext_min = 3.0       # border.focus, focus, accent, status marks, diff marks

# ---------------------------------------------------------------- dark
[dark.surface]
canvas = "#0B0B0B"      # the page: timeline and centre column
panel  = "#1e1e1e"      # cards, composer, notices
raised = "#242424"      # dialogs, menus, toasts, user message
sidebar = "#141414"     # the chrome: header band, left sidebar (and rail) and right sidebar


[dark.agent]
amber = "#d18a38"
blue = "#5c9cf5"
violet = "#a78bfa"
green = "#86b97a"
teal = "#55b9a5"
rose = "#dc8295"
sky = "#69b7d5"
gold = "#c9a94a"

[dark.text]
primary   = "#e6e7e8"   # titles, user and agent text, tool names
secondary = "#a4a9ae"   # tool arguments, summaries, labels
muted     = "#868c93"   # metadata, counts, key hints, timestamps, reasoning

[dark.border]
default = "#2a2a2a"     # hairlines and dividers (decorative)
strong  = "#4a4a50"     # diff split rule, tool-detail box (decorative)
focus   = "#e8a46e"     # focus ring / focus bar (meaningful, >= 3:1)

[dark.interactive]
accent    = "#e8a46e"   # brand mark, active tab, links, primary action
on_accent = "#121314"   # text on an accent fill
focus     = "#e8a46e"   # keyboard focus indicator
selection = "#2c2824"   # selected row/range background (accent tint)
hover     = "#1e1e1e"   # pointer-hover background

[dark.status]
success = "#8fc46a"
warning = "#e0af68"
error   = "#f27d8f"
info    = "#7aa7f0"

[dark.diff]
add    = "#8fc46a"
del    = "#f27d8f"
add_bg = "#1c2a1a"
del_bg = "#2e1b20"

# ---------------------------------------------------------------- light
[light.surface]
canvas = "#f7f7f5"
panel  = "#efefec"
raised = "#ffffff"
sidebar = "#f0f0ed"


[light.agent]
amber = "#905200"
blue = "#2459ac"
violet = "#6743ae"
green = "#396a30"
teal = "#126d5d"
rose = "#9a405a"
sky = "#23687f"
gold = "#735d0c"

[light.text]
primary   = "#1f2124"
secondary = "#4f555b"
muted     = "#5c636a"

[light.border]
default = "#d4d5d2"
strong  = "#c2c3c0"
focus   = "#a84e16"

[light.interactive]
accent    = "#a84e16"
on_accent = "#ffffff"
focus     = "#a84e16"
selection = "#f0e3d8"
hover     = "#e9e9e6"

[light.status]
success = "#2f7a1f"
warning = "#8a5d00"
error   = "#c0283f"
info    = "#2a5fc4"

[light.diff]
add    = "#2f7a1f"
del    = "#c0283f"
add_bg = "#e1f0dc"
del_bg = "#f8e1e4"

# Agent names are casefolded, then FNV-1a 32-bit selects a slot. Built-ins
# are pinned; custom names select from the unpinned slots (rose, sky, gold).
[agent_pins]
orchestrate = "amber"
build = "blue"
quick = "green"
scout = "teal"
plan = "violet"

# ---------------------------------------------------------------- roles
# Timeline roles are theme-independent: each names tokens, so both themes
# inherit them. fg/bg/rail are token references. `rail` is the left-edge bar
# colour, `label` the text that identifies the role without colour, `style`
# the extra text style. Role text is checked against its own background.
[roles.user_text]
fg = "text.primary"
bg = "surface.raised"
rail = "text.muted"
label = ""              # fallback rail identifies the user when surfaces collapse
style = ""

[roles.agent_text]
fg = "text.primary"
bg = "surface.canvas"
rail = ""
label = ""
style = ""

[roles.reasoning]
fg = "text.muted"
bg = "surface.canvas"
rail = "border.default"
label = "Thought"
style = "italic"

[roles.context_notice]  # something the model also received: handoff, clip, directory change
fg = "text.secondary"
bg = "surface.panel"
rail = "status.info"
label = "context"
style = ""

[roles.context_insertion]  # steering message, settings insertion
fg = "text.secondary"
bg = "surface.panel"
rail = "interactive.accent"
label = "inserted"
style = ""

[roles.diagnostic]      # execution diagnostics: hooks, retries, provider errors
fg = "text.secondary"
bg = "surface.panel"
rail = "status.warning"
label = "diagnostic"
style = ""

[roles.tool_row]
fg = "text.secondary"
bg = "surface.canvas"
rail = ""
label = ""
style = ""

[roles.child_card]
fg = "text.primary"
bg = "surface.panel"
rail = "status.info"
label = "child"
style = ""

