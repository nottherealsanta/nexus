# ---------------------------------------------------------------- monochrome
# Only bold, dim, reverse, underline. No colour, no italic, no background.
# Meaning that colour carried moves to glyph + label + prefix, which every
# mode shows anyway. text.muted is the only dim text; titles are bold.
[monochrome.tokens]
"surface.canvas" = []
"surface.panel" = []
"surface.raised" = []
"surface.sidebar" = []
"text.primary" = []
"text.secondary" = []
"text.muted" = ["dim"]
"border.default" = ["dim"]
"border.strong" = []
"border.focus" = ["bold"]
"interactive.accent" = ["bold"]
"interactive.focus" = ["bold"]         # always with the focus bar glyph
"interactive.selection" = ["reverse"]
"interactive.hover" = ["underline"]
"status.success" = []                  # glyph "+" and label carry it
"status.warning" = ["bold"]
"status.error" = ["bold", "underline"]
"status.info" = []
"diff.add" = ["bold"]                  # line prefix "+"
"diff.del" = ["dim"]                   # line prefix "-"
"diff.add_bg" = []
"diff.del_bg" = []
"interactive.on_accent" = ["reverse"]  # accent fills render as reverse video

"agent.amber" = ["bold"]
"agent.blue" = ["bold"]
"agent.violet" = ["bold"]
"agent.green" = ["bold"]
"agent.teal" = ["bold"]
"agent.rose" = ["bold"]
"agent.sky" = ["bold"]
"agent.gold" = ["bold"]

[monochrome.roles]
user_text = ["bold"]                   # rail glyph, no label
agent_text = []
reasoning = ["dim"]                    # label "Thought", rail "│"
context_notice = []                    # label "context", heavy rail "┃"
context_insertion = []                 # label "inserted", heavy rail "┃"
diagnostic = ["bold"]                  # label "diagnostic", marker "!"
tool_row = []
child_card = []                        # label "child", box border

# ---------------------------------------------------------------- glyphs
# `unicode` is default; `ascii` is used when the terminal or locale cannot
# draw it (and with --ascii / NEXUS10_ASCII). Every status glyph is paired
# with a word label (labels are shown where there is room, always in
# accessible names). No emoji, no glyph that needs two cells.
[glyphs.status]
#            unicode  ascii  label
running     = { unicode = "◐", ascii = "~", label = "running",     token = "text.primary" }
done        = { unicode = "✓", ascii = "+", label = "done",        token = "status.success" }
error       = { unicode = "✕", ascii = "x", label = "error",       token = "status.error" }
denied      = { unicode = "⊘", ascii = "-", label = "denied",      token = "status.error" }
waiting     = { unicode = "◆", ascii = "?", label = "waiting",     token = "interactive.accent" }
interrupted = { unicode = "◼", ascii = "!", label = "interrupted", token = "status.warning" }
cancelled   = { unicode = "⊖", ascii = "o", label = "cancelled",   token = "text.muted" }

[glyphs.spinner]
unicode = ["⣾", "⣽", "⣻", "⢿", "⡿", "⣟", "⣯", "⣷"]
ascii = ["|", "/", "-", "\\"]

[glyphs.fold]
open   = { unicode = "▾", ascii = "v" }
closed = { unicode = "▸", ascii = ">" }

[glyphs.sidebar]
left_open    = { unicode = "◧", ascii = "[|" }
left_closed  = { unicode = "□", ascii = "[ " }
right_open   = { unicode = "◨", ascii = "|]" }
right_closed = { unicode = "□", ascii = " ]" }
tab_sessions = { unicode = "≡", ascii = "S" }
tab_files    = { unicode = "▤", ascii = "F" }
tab_projects = { unicode = "◫", ascii = "P" }

# Verb glyphs in front of tool rows (DESIGN_PLAN.md D06). The status glyph
# replaces the verb glyph while a tool runs, fails, is denied or waits.
[glyphs.verb]
read    = { unicode = "→", ascii = ">" }
edit    = { unicode = "←", ascii = "<" }   # edit, write, patch
shell   = { unicode = "$", ascii = "$" }
search  = { unicode = "*", ascii = "*" }
code    = { unicode = "λ", ascii = "L" }
ask     = { unicode = "?", ascii = "?" }
session = { unicode = "↳", ascii = "^" }
web     = { unicode = "↗", ascii = "^" }

[glyphs.attention]
waiting = { unicode = "◆", ascii = "?", token = "interactive.accent", rank = 1 }
error   = { unicode = "✕", ascii = "x", token = "status.error",       rank = 2 }
unread  = { unicode = "●", ascii = "*", token = "status.info",        rank = 3 }

[glyphs.structure]
focus_bar  = { unicode = "▌", ascii = ">" }
rail       = { unicode = "│", ascii = "|" }
rail_heavy = { unicode = "┃", ascii = "|" }
tree_mid   = { unicode = "├─", ascii = "|-" }
tree_end   = { unicode = "╰─", ascii = "`-" }
rule       = { unicode = "─", ascii = "-" }
ellipsis   = { unicode = "…", ascii = "..." }
separator  = { unicode = "·", ascii = "-" }
breadcrumb = { unicode = "›", ascii = ">" }
arrow      = { unicode = "→", ascii = "->" }
close      = { unicode = "×", ascii = "x" }
