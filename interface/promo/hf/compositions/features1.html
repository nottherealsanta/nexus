  <script>
    (function () {
      const PLAN = {"a": {"start": 0.0, "plan": [[0, 1000, 540, 1.0, 600], [0, 1000, 522, 1.45, 640], [1, 1000, 522, 1.45, 640], [1, 1100, 540, 1.7, 640], [2, 1000, 420, 1.6, 640], [2, 1050, 560, 1.45, 640], [3, 1050, 430, 1.6, 640], [3, 1000, 540, 1.3, 640]], "n": 4}, "b": {"start": 3.9, "plan": [[0, 1000, 540, 1.0, 600], [1, 900, 745, 1.55, 640], [2, 900, 740, 1.6, 640], [3, 900, 735, 1.6, 640], [4, 900, 720, 1.65, 640], [5, 330, 200, 1.7, 540], [5, 900, 660, 1.65, 640], [6, 900, 665, 1.55, 640]], "n": 7}, "c": {"start": 7.8, "plan": [[0, 1000, 540, 0.95, 590], [0, 1250, 720, 1.3, 650], [0, 1250, 640, 1.3, 650], [1, 850, 740, 1.7, 640], [1, 720, 755, 1.7, 640], [2, 1450, 95, 1.7, 500], [2, 900, 790, 1.5, 640], [2, 1000, 540, 0.95, 590]], "n": 3}};
      const BEAT = 0.4875;
      const PROV_N = 9;
      const state = {};
      function cam(fx, fy, s, cy) { return { x: 960 - fx * s, y: cy - fy * s, scale: s }; }
      function beatOf(L, t) { const b = Math.floor((t - L.start + 1e-6) / BEAT); return Math.max(0, Math.min(7, b)); }
      const imgs = {};
      for (const id in PLAN) { imgs[id] = []; for (let k = 0; k < PLAN[id].n; k++) imgs[id].push(document.getElementById("features1-" + id + "-f" + k)); state[id] = { f: -1, b: -2 }; }
      function draw(t) {
        for (const id in PLAN) {
          const L = PLAN[id];
          if (t < L.start - 1e-6 || t >= L.start + 3.9 + 1e-6) continue;
          const b = beatOf(L, t), st = state[id];
          if (st.b === b) continue;
          st.b = b;
          const f = L.plan[b][0];
          if (st.f !== f) { if (st.f >= 0) imgs[id][st.f].style.visibility = "hidden"; imgs[id][f].style.visibility = "visible"; st.f = f; }
          for (let k = 0; k < 8; k++) document.getElementById("features1-" + id + "-b" + k).classList.toggle("on", k <= b);
          if (id === "a") for (let k = 0; k < PROV_N; k++) {
            const el = document.getElementById("features1-a-p" + k);
            const lit = k <= Math.min(b, 7) || (b === 7 && k === 8);
            el.classList.toggle("on", lit);
            el.classList.toggle("now", k === b || (b === 7 && k >= 7));
          }
          if (id === "c") for (let k = 0; k < 3; k++) document.getElementById("features1-c-p" + k).classList.toggle("on", b >= k + 3);
        }
      }
      const tl = gsap.timeline({ paused: true });
      const proxy = { t: 0 };
      tl.to(proxy, { t: 11.7, duration: 11.7, ease: "none", onUpdate: () => draw(proxy.t) }, 0);
      // camera: punch on every beat (expo.out from the previous pose, or a pulse when the pose repeats)
      for (const id in PLAN) {
        const L = PLAN[id];
        const pan = "#features1-" + id + "-pan";
        L.plan.forEach((p, k) => {
          const tb = L.start + k * BEAT;
          const to = cam(p[1], p[2], p[3], p[4]);
          let from;
          if (k === 0) from = cam(p[1], p[2], p[3] * 1.12, p[4]);
          else {
            const q = L.plan[k - 1];
            const same = q[1] === p[1] && q[2] === p[2] && q[3] === p[3] && q[4] === p[4];
            from = same ? cam(p[1], p[2], p[3] * 1.06, p[4]) : cam(q[1], q[2], q[3] * 1.0, q[4]);
          }
          tl.fromTo(pan, from, { ...to, duration: 0.42, ease: "expo.out", immediateRender: false }, tb);
          tl.fromTo("#features1-" + id + "-flash", { opacity: k === 7 ? 0.0 : 0.16 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, tb);
        });
        tl.fromTo("#features1-" + id + "-cam", { rotationX: 5, rotationY: 7 }, { rotationX: 2, rotationY: -4, duration: 3.9, ease: "sine.inOut", immediateRender: false }, L.start);
      }
      // allow flash (green) on beat 5 of the approval layer
      tl.fromTo("#features1-c-flash", { opacity: 0.3, background: "radial-gradient(ellipse at 50% 40%, rgba(134,185,122,.65), rgba(134,185,122,.15) 60%, rgba(0,0,0,0))" }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 7.8 + 5 * BEAT);
      // captions
      function capIn(sel, at) { tl.fromTo(sel, { opacity: 0, y: 30, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: false }, at); }
      function capOut(sel, at) { tl.to(sel, { opacity: 0, y: -18, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, at); }
      capIn("#features1-a-c1", 0); capIn("#features1-a-c2", 4 * BEAT);
      capIn("#features1-b-c1", 3.9); capOut("#features1-b-c1", 3.9 + 4 * BEAT - 0.2); capIn("#features1-b-c2", 3.9 + 4 * BEAT);
      capIn("#features1-c-c1", 7.8);
      tl.fromTo(".chip.on, .chip", { y: 10 }, { y: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, 7.8 + 3 * BEAT);
      draw(0);
      window.__timelines["features1"] = tl;
    })();
