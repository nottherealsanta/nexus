  <script>
    (function () {
      const NF = 74, NT = 11, NS = 62;
      const imgsEl = []; for (let i = 0; i < NF; i++) imgsEl.push(document.getElementById("intro-f" + i));
      const letters = document.querySelectorAll(".intro-ch");
      const cursor = document.getElementById("intro-cursor");
      const typeAt = [1.95, 2.10, 2.25, 2.42, 2.56];
      const BEAT = 0.4875;
      let shown = -1, nTyped = -1, curOn = -1;
      function frameAt(t) {
        if (t < 4) return -1;
        if (t < 5.6) return 0;
        if (t < 6.8) return Math.min(NT - 1, Math.floor((t - 5.6) / 0.11));
        if (t >= 13.1) return NF - 1;
        return NT + Math.min(NS - 1, Math.floor((t - 6.8) / 0.1097));
      }
      function draw(t) {
        const f = frameAt(t);
        if (f !== shown) {
          if (shown >= 0) imgsEl[shown].style.visibility = "hidden";
          if (f >= 0) imgsEl[f].style.visibility = "visible";
          shown = f;
        }
        let n = 0; for (let i = 0; i < 5; i++) if (t >= typeAt[i]) n = i + 1;
        let on;
        if (t < typeAt[0]) on = Math.floor(t / BEAT) % 2 === 0 ? 1 : 0;
        else if (t < 2.9) on = 1;
        else on = Math.floor((t - 2.9) / BEAT) % 2 === 0 ? 1 : 0;
        if (t < 4) {
          for (let i = 0; i < 5; i++) letters[i].style.opacity = i < n ? 1 : 0;
          if (n !== nTyped) { cursor.style.left = (n * 115.2 + 7) + "px"; nTyped = n; }
          cursor.style.opacity = on;
        }
      }
      function cam(fx, fy, s, cx, cy) { return { x: (cx === undefined ? 960 : cx) - fx * s, y: (cy === undefined ? 540 : cy) - fy * s, scale: s }; }
      const tl = gsap.timeline({ paused: true });
      const proxy = { t: 0 };
      tl.to(proxy, { t: 15.45, duration: 15.45, ease: "none", onUpdate: () => draw(proxy.t) }, 0);
      // title: glow breath, blur out
      tl.fromTo("#intro-glow", { opacity: 0.2 }, { opacity: 1, duration: 2.6, ease: "sine.inOut" }, 0);
      tl.fromTo("#intro-word", { filter: "blur(0px)", opacity: 1, scale: 1 }, { filter: "blur(34px)", opacity: 0, scale: 1.12, duration: 0.72, ease: "power2.in", immediateRender: false }, 3.25);
      tl.fromTo("#intro-word", { scale: 0.97 }, { scale: 1, duration: 1.3, ease: "sine.out", immediateRender: false }, 1.9);
      // camera
      const home = cam(1000, 536, 0.96);
      tl.set("#intro-pan", home, 0);
      tl.set("#intro-cam", { rotationX: 0, rotationY: 0 }, 0);
      // wipe: clip + scanline
      tl.fromTo("#intro-reveal", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.6, ease: "power2.inOut", immediateRender: false }, 4.0);
      tl.fromTo("#intro-scan", { y: -2 }, { y: 1072, duration: 1.6, ease: "power2.inOut", immediateRender: false }, 4.0);
      tl.fromTo("#intro-trail", { y: -140 }, { y: 932, duration: 1.6, ease: "power2.inOut", immediateRender: false }, 4.0);
      tl.fromTo(["#intro-scan", "#intro-trail"], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, 4.0);
      tl.to(["#intro-scan", "#intro-trail"], { opacity: 0, duration: 0.18, ease: "none" }, 5.5);
      // tilt back into 3D
      tl.fromTo("#intro-cam", { rotationX: 0, rotationY: 0 }, { rotationX: 12, rotationY: -15, duration: 2.6, ease: "power3.inOut", immediateRender: false }, 4.0);
      tl.fromTo("#intro-pan", home, { ...cam(1000, 536, 0.88), duration: 2.6, ease: "power3.inOut", immediateRender: false }, 4.0);
      // flyover keyframes (macro, ~2x)
      const keys = [
        [7.8, 1150, 745, 1.5], [9.0, 1300, 790, 1.5], [10.0, 1100, 770, 1.5],
        [11.0, 900, 660, 1.6], [12.2, 860, 740, 1.55], [13.0, 1420, 925, 1.45], [13.6, 1420, 925, 1.52]
      ];
      let prev = cam(1000, 536, 0.88), pt = 6.6;
      // start the approach at 6.6 so the camera is already moving at the cut to macro
      tl.fromTo("#intro-pan", cam(1000, 536, 0.88), { ...cam(1150, 745, 1.5), duration: 1.2, ease: "power2.inOut", immediateRender: false }, 6.6);
      for (let i = 1; i < keys.length; i++) {
        const a = keys[i - 1], b = keys[i];
        tl.fromTo("#intro-pan", cam(a[1], a[2], a[3]), { ...cam(b[1], b[2], b[3]), duration: b[0] - a[0], ease: "sine.inOut", immediateRender: false }, a[0]);
      }
      // 3D drift during flyover, rising energy
      tl.fromTo("#intro-cam", { rotationX: 12, rotationY: -15 }, { rotationX: 9, rotationY: -9, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 6.6);
      tl.fromTo("#intro-cam", { rotationX: 9, rotationY: -9 }, { rotationX: 6, rotationY: 6, duration: 5.8, ease: "sine.inOut", immediateRender: false }, 7.8);
      tl.fromTo("#intro-lift", { opacity: 0 }, { opacity: 0.5, duration: 5.2, ease: "power2.in", immediateRender: false }, 8.4);
      tl.fromTo("#intro-pan", { filter: "brightness(1)" }, { filter: "brightness(1.22)", duration: 5.2, ease: "power2.in", immediateRender: false }, 8.4);
      tl.fromTo("#intro-flash", { opacity: 0.0 }, { opacity: 0.3, duration: 0.04, immediateRender: false }, 13.1);
      tl.to("#intro-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 13.14);
      // breath: back to the whole window, caption beneath
      const endCam = cam(1000, 536, 0.74, 960, 467);
      tl.fromTo("#intro-pan", cam(1420, 925, 1.52), { ...endCam, duration: 1.5, ease: "power3.inOut", immediateRender: false }, 13.6);
      tl.fromTo("#intro-pan", { filter: "brightness(1.22)" }, { filter: "brightness(1)", duration: 1.5, ease: "power2.out", immediateRender: false }, 13.6);
      tl.fromTo("#intro-lift", { opacity: 0.5 }, { opacity: 0.2, duration: 1.5, ease: "power2.out", immediateRender: false }, 13.6);
      tl.fromTo("#intro-cam", { rotationX: 6, rotationY: 6 }, { rotationX: 3, rotationY: -2, duration: 1.8, ease: "power3.inOut", immediateRender: false }, 13.6);
      // caption 13.8 -> 15.0
      tl.fromTo("#intro-cap-in", { opacity: 0, y: 26, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 13.8);
      tl.to("#intro-cap-in", { opacity: 0, duration: 0.15, ease: "power1.in" }, 14.85);
      draw(0);
      window.__timelines["intro"] = tl;
    })();
