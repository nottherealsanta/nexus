  </style>

  <script>
    const tl = gsap.timeline({ paused: true });
    const cam = document.getElementById("nsh-cam");
    const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const rnd = mulberry32(48);
    const P = "assets/cap/nsh/";
    const mk = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };

    // ---- floor ----
    const floor = mk('<div id="nsh-floor"></div>'), grid = mk('<div id="nsh-grid"></div>');
    [floor, grid].forEach((f) => { cam.appendChild(f); });
    gsap.set([floor, grid], { rotationX: 90, y: 372, z: -40, transformOrigin: "50% 50%" });

    // ---- devices ----
    const mkDev = (id, w, h, inner) => { const d = mk('<div class="nsh-dev" id="' + id + '" style="width:' + w + 'px;height:' + h + 'px;margin:' + (-h / 2) + 'px 0 0 ' + (-w / 2) + 'px"><div class="nsh-devin">' + inner + '</div></div>'); cam.appendChild(d); return d; };
    const TL = '<div class="nsh-tl"><i></i><i></i><i></i></div>';
    const webW = 760, webBar = 46, webH = Math.round(webW / 1.6) + webBar;
    const macW = 1000, macBar = 36, macH = Math.round(macW / 1.6) + macBar;
    const phW = 318, phH = Math.round((phW - 22) / (1170 / 2532)) + 22;
    const web = mkDev("nsh-web", webW, webH, '<div class="nsh-win"><div class="nsh-bar" style="height:' + webBar + 'px">' + TL + '<div class="nsh-url">localhost:7777</div></div><div class="nsh-scr" id="nsh-webscr" style="top:' + webBar + 'px"></div></div>');
    const mac = mkDev("nsh-mac", macW, macH, '<div class="nsh-win" style="border-radius:12px"><div class="nsh-bar" style="height:' + macBar + 'px;background:#101011">' + TL + '<div class="nsh-title">Nexus</div></div><div class="nsh-scr" id="nsh-macscr" style="top:' + macBar + 'px"></div></div>');
    const ph = mkDev("nsh-ph", phW, phH, '<div class="nsh-phone"><div class="nsh-isl"></div><div class="nsh-scr" id="nsh-phscr"></div></div><div class="nsh-btn" style="left:-4px;top:150px;height:54px"></div><div class="nsh-btn" style="left:-4px;top:222px;height:54px"></div><div class="nsh-btn" style="right:-4px;top:190px;height:86px"></div>');

    // ---- screens: the same Auth refactor session, stepped in sync ----
    const addImg = (scr, src, id) => { const im = document.createElement("img"); im.src = src; im.id = id; scr.appendChild(im); return im; };
    const ids = []; for (let i = 0; i <= 46; i += 2) ids.push(String(i).padStart(2, "0"));
    const tOf = (n) => (n === 0 ? 0 : 1.0 + (n - 1) * 0.115);
    const seq = (scrId, tag, finalSrc, finalT) => {
      const scr = document.getElementById(scrId);
      const imgs = ids.map((s) => addImg(scr, P + "lo/01-timeline-stream-f" + s + ".png", "nsh-" + tag + "-f" + s));
      const fin = addImg(scr, P + "lo/" + finalSrc + ".png", "nsh-" + tag + "-fin");
      const all = imgs.concat([fin]);
      const times = ids.map((s) => tOf(parseInt(s, 10))).concat([finalT]);
      all.forEach((im, k) => {
        tl.set(im, { opacity: 1 }, times[k]);
        if (k + 1 < all.length) tl.set(im, { opacity: 0 }, times[k + 1]);
      });
    };
    seq("nsh-webscr", "w", "02-session-layout-mermaid", 6.5);
    seq("nsh-macscr", "m", "02-session-layout", 6.35);
    {
      const scr = document.getElementById("nsh-phscr");
      const a = addImg(scr, P + "03-phone-session.png", "nsh-ph-a"), b = addImg(scr, P + "03-phone-session-mermaid.png", "nsh-ph-b");
      tl.set(a, { opacity: 1 }, 0).set(a, { opacity: 0 }, 5.0).set(b, { opacity: 1 }, 5.0);
    }

    // ---- 3D choreography ----
    const rest = {
      web: { x: -520, y: -70, z: -300, ry: 14 },
      mac: { x: 30, y: -10, z: 0, ry: 0 },
      ph: { x: 700, y: 10, z: 30, ry: -14 },
    };
    const devs = { web, mac, ph };
    Object.keys(devs).forEach((k, i) => {
      const r = rest[k];
      tl.fromTo(devs[k], { x: 0, y: 0, z: -400, scale: 0.02, rotationY: r.ry + 70, rotationZ: -24 + i * 22, opacity: 0 },
        { x: r.x, y: r.y, z: r.z, scale: 1, rotationY: r.ry, rotationZ: 0, opacity: 1, duration: 1.0 + i * 0.05, ease: "expo.out" }, 0.0 + i * 0.03);
      // slow float
      tl.to(devs[k], { y: r.y - 14, duration: 3.6, ease: "sine.inOut" }, 1.2 + i * 0.2).to(devs[k], { y: r.y + 4, duration: 3.0, ease: "sine.inOut" }, 4.8 + i * 0.2);
    });
    // camera orbit
    tl.fromTo(cam, { rotationY: 7, rotationX: 3, z: 30, y: -20, transformOrigin: "50% 50%" }, { rotationY: -5, rotationX: 1, z: 110, y: -40, duration: 7.8, ease: "sine.inOut" }, 0);
    tl.fromTo([floor, grid], { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.3);

    // ---- burst ----
    const fx = document.getElementById("nsh-fxl");
    fx.innerHTML = '<div class="nsh-core" id="nsh-core"></div><div id="nsh-flash"></div><div class="nsh-ring" id="nsh-r1"></div><div class="nsh-ring" id="nsh-r2" style="border-width:2px"></div>';
    for (let i = 0; i < 44; i++) {
      const wrap = mk('<div style="position:absolute;left:50%;top:50%;width:0;height:0"><div class="nsh-streak" id="nsh-st' + i + '" style="left:0;top:0"></div></div>'); fx.appendChild(wrap);
      const s = wrap.firstChild;
      const a = rnd() * 360, d = 600 + rnd() * 1200, w = 120 + rnd() * 300, dur = 0.7 + rnd() * 0.3;
      gsap.set(wrap, { rotation: a });
      tl.fromTo(s, { x: 40, width: w }, { x: d, duration: dur, ease: "expo.out" }, 0);
      tl.fromTo(s, { opacity: 0 }, { opacity: 0.95, duration: 0.05, ease: "none" }, 0).to(s, { opacity: 0, duration: 0.5, ease: "power1.in", overwrite: "auto" }, 0.1);
    }
    tl.fromTo("#nsh-core", { scale: 0.6, opacity: 1 }, { scale: 9, opacity: 0, duration: 0.45, ease: "power3.out" }, 0);
    tl.fromTo("#nsh-flash", { opacity: 1 }, { opacity: 0, duration: 0.42, ease: "power2.out" }, 0.04);
    tl.fromTo("#nsh-r1", { scale: 0.1, opacity: 1 }, { scale: 8.5, opacity: 0, duration: 1.0, ease: "expo.out" }, 0);
    tl.fromTo("#nsh-r2", { scale: 0.1, opacity: 0.8 }, { scale: 6.5, opacity: 0, duration: 1.2, ease: "expo.out" }, 0.1);

    // ---- close-ups: camera glide (cx,cy = content point as fraction; tx,ty = where it lands on the frame) ----
    const W = 1640, H = 1025, CH = 880;
    const glide = (id, c, a, b, dur) => {
      const el = document.querySelector("#" + id + " .nsh-cam2");
      const st = (s) => ({ scale: s, x: c.tx * W - c.cx * W * s, y: c.ty * CH - c.cy * H * s });
      tl.fromTo(el, Object.assign({ transformOrigin: "0 0" }, st(a)), Object.assign({ transformOrigin: "0 0", duration: dur, ease: "power1.out" }, st(b)), parseFloat(document.getElementById(id).dataset.start));
    };
    glide("nsh-s1", { cx: 0.26, cy: 0.24, tx: 0.46, ty: 0.42 }, 1.45, 1.8, 0.975);
    glide("nsh-s2", { cx: 0.46, cy: 0.33, tx: 0.52, ty: 0.42 }, 1.3, 1.62, 0.975);
    glide("nsh-s3", { cx: 0.6, cy: 0.3, tx: 0.52, ty: 0.42 }, 1.45, 1.75, 0.975);
    glide("nsh-s4", { cx: 0.86, cy: 0.64, tx: 0.7, ty: 0.42 }, 1.3, 1.5, 0.975);
    glide("nsh-s5", { cx: 0.58, cy: 0.45, tx: 0.5, ty: 0.46 }, 1.35, 1.6, 1.95);

    // palette: pops in, slow push
    tl.fromTo(".nsh-pal", { scale: 0.88, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 13.65);
    tl.fromTo(".nsh-pal", { scale: 1 }, { scale: 1.1, duration: 1.45, ease: "sine.inOut", immediateRender: false }, 14.15);

    // ---- captions ----
    const cap = (id, at, dur) => {
      const sp = "#" + id + " span";
      tl.fromTo(sp, { y: 40, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, at);
      tl.to(sp, { opacity: 0, y: -14, duration: 0.25, ease: "power2.in" }, at + dur - 0.3);
    };
    cap("nsh-c1", 0.8, 3.0); cap("nsh-c2", 3.9, 3.8); cap("nsh-c3", 7.9, 3.7); cap("nsh-c4", 11.8, 3.7);
    tl.fromTo("#nsh-scrim", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 7.8);

    window.__timelines["nsh"] = tl;
  </script>
