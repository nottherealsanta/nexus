services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:18765/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in websearch/.env}
    volumes:
      - ./searxng:/etc/searxng:rw
