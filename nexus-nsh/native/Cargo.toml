[package]
name = "nexus-nsh-native"
description = "Native services for the Nexus NSH client: microphone capture for dictation and Mermaid compilation."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

nsh-core = { git = "https://github.com/longbridge/nsh", rev = "209cb8492705321315745f2745c8060816b6d378" }

# Every target uses the same compiler and PNG rasterizer. Native has no text
# engine in its SVG backend; the web client uses the same PNG so both clients
# draw one artifact rather than two renderers' interpretations.
nexus-annotate = { path = "../../nexus-annotate" }
nexus-mermaid = { path = "../../nexus-mermaid", default-features = false, features = ["svg", "raster"] }

[target.'cfg(target_os = "ios")'.dependencies]
cpal = "=0.18.2"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
block2 = "0.6.2"
futures-channel = "0.3"
objc2 = "0.6.5"
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["CoreAudioBaseTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std", "NSData", "NSDictionary", "NSError", "NSObject", "NSPathUtilities",
  "NSString", "NSURL", "NSUUID", "NSValue",
] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
  "std", "block2", "AVAudioRecorder", "AVAudioSession", "AVAudioSessionTypes", "AVAudioSettings",
] }
