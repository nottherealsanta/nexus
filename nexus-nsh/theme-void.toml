# Compatibility overlay: NSH now uses interface/theme.toml's palette, like the Rust TUI.
# Only the NSH user-band alias remains; its colours match surface.raised.
[dark.surface]
band = "#242424"

[light.surface]
band = "#ffffff"

[fallback256.dark]
"surface.band" = 235

[fallback256.light]
"surface.band" = 255

[fallback16.dark]
"surface.band" = "default"

[fallback16.light]
"surface.band" = "default"

[monochrome.tokens]
"surface.band" = []
