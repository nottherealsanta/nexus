# Standalone throw-away project: static Textual mock-ups of the `nexus chat` UI.
# It is not part of the nexus package, its wheel, its tests, or its workspace.
[project]
name = "nexus-design-mockups"
version = "0.0.0"
description = "Static TUI design mock-ups for Nexus (not shipped)"
requires-python = ">=3.13"
dependencies = ["textual==8.2.8"]

[project.scripts]
design = "design_mockups.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
