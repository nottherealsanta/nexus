[project]
name = "nexus10"
version = "0.10.0.dev0"
description = "Nexus rebuilt from the provider wire up"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pydantic-monty==1.1.0",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "tomlkit>=0.15.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
nexus = "nexus.cli:main"

[project.optional-dependencies]
voice = [
    "constriction>=0.5,<0.6; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "huggingface-hub>=0.34",
    "librosa>=0.11,<1; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "numpy>=1.26",
    "ptts>=0.4.1,<1",
    "torch>=2.6,<3; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "transformers>=5.19,<6; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
