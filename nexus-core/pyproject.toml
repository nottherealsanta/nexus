[project]
name = "nexus10"
version = "0.10.0.dev0"
description = "Nexus rebuilt from the provider wire up"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1",
    "httpx>=0.27",
    "pydantic-monty==1.1.0",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
