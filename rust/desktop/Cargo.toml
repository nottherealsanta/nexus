[package]
name = "nexus-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
async-channel = "2"
base64 = "0.22"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
