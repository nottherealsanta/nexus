[package]
name = "nexus-client-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "NSH-free protocol core for the Nexus web/desktop client (plan section 4)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
