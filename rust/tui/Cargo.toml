[package]
name = "nexus-ratatui"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[dependencies]
ratatui = "0.29"
nexus-widgets = { path = "../widgets" }
crossterm = { version = "0.28", features = ["use-dev-tty", "libc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui-markdown = { version = "=0.3.6", default-features = false, features = ["markdown"] }
ratatui-image = "8"
base64 = "0.22"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Native-only Mermaid fallback; pin the compiler, not its browser/WASM wrapper.
ondine = { package = "compiler", git = "https://github.com/wevm/ondine", rev = "0b589ec34481856b4153526f10a0a35558a201a8", default-features = false, features = ["all"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
